<title>English Year 4 – Fun Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== TEMA KAD KARTUN (ikut rujukan) ===== */
:root{
  --navy:#213a7c; --blue:#0b52c4; --blue-d:#073e9a; --lav:#d0d9ff; --lav2:#eef1ff; --ink:#111;
  --c1:#ef7a5c; --c2:#f2e36b; --c3:#7fdc6c; --c4:#ef6fd6;
  --ok:#22c55e; --ok-d:#118a3e; --okbg:#dcfce7; --bad:#ff4d5e; --bad-d:#c81e3a; --badbg:#ffe1e5;
  --sun:#ffd23f; --muted:#3b3f73;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Fredoka","Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  background:var(--navy); color:var(--ink); font-size:24px; line-height:1.35; min-height:100vh;
  overflow-x:hidden; font-weight:500;
}
button{font-family:inherit}
.wrap{max-width:1500px;margin:0 auto;padding:18px 16px 110px}
.hidden{display:none!important}
.center{text-align:center}

/* kad lavender berlapis (macam dalam gambar) */
.kad{background:var(--lav);border:4px solid var(--ink);border-radius:30px;padding:20px 24px;
  box-shadow:0 12px 0 0 var(--lav),0 12px 0 4px var(--ink);margin-bottom:30px;position:relative}

/* bar atas */
.top{display:flex;align-items:center;gap:12px;margin:0 0 22px;flex-wrap:wrap}
.top .pill{background:var(--lav);border:4px solid var(--ink);border-radius:999px;padding:4px 18px;font-weight:700;font-size:22px;white-space:nowrap}
.top .bar{flex:1;min-width:120px;height:24px;background:var(--lav2);border:4px solid var(--ink);border-radius:999px;overflow:hidden}
.top .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c3),var(--c2));transition:width .5s}

/* kad bahan / petikan */
.stim{background:var(--lav);border:4px solid var(--ink);border-radius:30px;padding:18px 24px;
  box-shadow:0 12px 0 0 var(--lav),0 12px 0 4px var(--ink);margin:0 0 34px;font-size:25px;font-weight:600;line-height:1.4;
  max-height:52vh;overflow:auto;animation:slideIn .45s both}
.stim .stitle,.stim > b:first-child{display:block;text-align:center;font-weight:700;font-size:30px;margin-bottom:6px}
.stim p{margin:6px 0}
.stim img{max-width:100%;border-radius:14px;display:block;margin:8px auto 0;background:#fff;border:3px solid var(--ink)}

/* panel soalan biru */
.qwrap{position:relative;margin:0 130px 30px 90px}
.qpanel{position:relative;background:var(--blue);border:4px solid var(--ink);border-radius:32px;padding:14px 18px 22px;
  box-shadow:0 14px 0 0 var(--blue),0 14px 0 4px var(--ink);display:flex;flex-direction:column;gap:16px;animation:slideIn .45s .05s both}
.qhead{background:var(--lav);border:4px solid var(--ink);border-radius:26px;padding:12px 18px 18px;
  box-shadow:0 12px 0 0 var(--lav),0 12px 0 4px var(--ink);margin-bottom:14px;text-align:center}
.qlabel{display:block;border:4px solid var(--ink);border-radius:999px;padding:2px 14px;font-size:24px;font-weight:500;background:var(--lav2);margin-bottom:12px}
.qlabel small{font-size:18px;font-weight:600;opacity:.75}
.qtext{font-size:32px;font-weight:500;line-height:1.3}
.qtext .box,.qhead .box{border:3px solid var(--ink);border-radius:16px;background:var(--lav2);padding:10px 14px;margin:10px 0;text-align:left;font-size:25px}
.qhead .visual{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:12px}
.qhead .visual svg{max-width:100%;height:auto;background:#fff;border-radius:14px}
.qhead .bigq{font-size:40px;font-weight:700;color:var(--blue);margin-top:8px}
.qhead .instr{font-size:20px;font-weight:600;color:#3b3f73;margin-top:8px}

/* pilihan jawapan grid 2x2 */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.opts.one{grid-template-columns:1fr}
.opt{display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;width:100%;min-height:76px;
  background:var(--blue);color:var(--lav2);border:5px solid var(--c1);border-radius:26px;padding:10px 16px;
  font-size:27px;font-weight:500;line-height:1.2;cursor:pointer;transition:transform .15s,background .15s,color .15s,box-shadow .15s}
.opts > .opt:nth-child(4n+2){border-color:var(--c2)}
.opts > .opt:nth-child(4n+3){border-color:var(--c3)}
.opts > .opt:nth-child(4n+4){border-color:var(--c4)}
.opt:hover:not(:disabled){transform:translateY(-3px) scale(1.02)}
.opt .k,.opt .L,.opt .let{flex:none;width:40px;height:40px;border-radius:50%;background:var(--lav2);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:22px}
.opt.sel{background:var(--lav2);color:var(--ink);box-shadow:0 0 0 4px var(--ink) inset;transform:scale(1.03)}
.opt.sel .k,.opt.sel .L,.opt.sel .let{background:var(--blue);color:#fff}
.opt.ok,.opt.right{background:var(--ok)!important;color:#fff!important;border-color:var(--ink)!important;animation:pop .55s}
.opt.bad,.opt.wrong{background:var(--bad)!important;color:#fff!important;border-color:var(--ink)!important;animation:shake .5s}
.opt.ok .k,.opt.right .let,.opt.ok .L,.opt.bad .k,.opt.wrong .let,.opt.bad .L{background:#fff;color:var(--ink)}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.bad):not(.right):not(.wrong):not(.sel){opacity:.55}

/* butang Semak besar */
.semak{order:10;width:100%;background:var(--blue);border:4px solid var(--ink);border-radius:26px;padding:6px 18px 10px;
  color:var(--lav);font-size:54px;font-weight:700;line-height:1.1;cursor:pointer;letter-spacing:.5px;
  text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 4px 0 var(--ink);
  box-shadow:0 6px 0 var(--blue-d);transition:transform .1s,filter .15s}
.semak:hover:not(:disabled){filter:brightness(1.12)}

<body>
<div class="wrap" id="app"></div>

<!-- ===== BUNYI-KIT: muzik latar fokus + kesan bunyi (Web Audio, tiada fail luar) ===== -->
<style>
.sk-ctrl{position:fixed;right:14px;bottom:14px;z-index:9999;display:flex;gap:8px;background:rgba(255,255,255,.92);
  padding:6px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.sk-ctrl button{width:54px;height:54px;border-radius:50%;border:3px solid #e6e8f0;background:#fff;font-size:26px;
  cursor:pointer;transition:transform .15s;line-height:1;font-family:inherit}
.sk-ctrl button:hover{transform:scale(1.08)}
.sk-ctrl button.off{background:#eee;filter:grayscale(1);opacity:.6}
.sk-ctrl button.on.mus{animation:skPulse 1.4s ease-in-out infinite}
@keyframes skPulse{50%{transform:scale(1.07)}}
@media (max-width:520px){.sk-ctrl button{width:46px;height:46px;font-size:22px}}
</style>
<script>
(function(){
  const store={get(k,d){try{const v=localStorage.getItem("sk_"+k);return v===null?d:v==="1"}catch(e){return d}},
               set(k,v){try{localStorage.setItem("sk_"+k,v?"1":"0")}catch(e){}}};
  let ctx=null,master,musicBus,sfxBus,comp,noiseBuf=null,timer=null;
  let musicOn=store.get("music",true),sfxOn=store.get("sfx",true),playing=false,wantMusic=false;
  const MUSIC_VOL=.22,BPM=76,STEP=60/BPM/2; // 1 langkah = not 1/8
  let step=0,nextT=0,loop=0;

  function init(){
    if(ctx) return ctx.state==="suspended"&&ctx.resume();
    try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
    comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;comp.connect(ctx.destination);
    master=ctx.createGain();master.gain.value=.9;master.connect(comp);
    musicBus=ctx.createGain();musicBus.gain.value=0;musicBus.connect(master);
    sfxBus=ctx.createGain();sfxBus.gain.value=sfxOn?.55:0;sfxBus.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*.5,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  const hz=m=>440*Math.pow(2,(m-69)/12);

  /* ---- alat bunyi asas ---- */
  function note(bus,midi,t,dur,{type="sine",vol=.2,att=.008,cut=0,detune=0}={}){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=hz(midi);o.detune.value=detune;
    let out=o;
    if(cut){const f=ctx.createBiquadFilter();f.type="lowpass";f.frequency.value=cut;o.connect(f);out=f}
    out.connect(g);g.connect(bus);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);
    g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.start(t);o.stop(t+dur+.05);
  }
  function mallet(bus,midi,t,vol=.16,dur=.9){ // bunyi seperti marimba/kalimba
    note(bus,midi,t,dur,{type:"sine",vol});
    note(bus,midi+12,t,dur*.35,{type:"sine",vol:vol*.25});
  }
  function noise(bus,t,dur,vol,freq,type="highpass"){
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=noiseBuf;
    f.type=type;f.frequency.value=freq;s.connect(f);f.connect(g);g.connect(bus);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.start(t);s.stop(t+dur+.02);
  }
  function glide(bus,f1,f2,t,dur,vol,type="sine"){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;
    o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    o.connect(g);g.connect(bus);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);
    g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.start(t);o.stop(t+dur+.05);
  }

  /* ---- MUZIK LATAR: tenang, pentatonik, ~76 BPM, tiada lirik → bantu fokus & berfikir ---- */
  // Progresi C – Am – F – G (setiap satu 1 bar = 8 langkah)
  const CHORDS=[[48,[60,64,67,72]],[45,[57,60,64,69]],[41,[57,60,65,69]],[43,[55,59,62,67]]];
  const PENTA=[72,74,76,79,81,84];
  const PATTERNS=[[0,2,1,3,2,1,0,2],[0,1,2,3,2,3,1,2],[3,2,1,0,1,2,3,1],[0,2,3,2,1,2,0,1]];
  let pat=PATTERNS[0],melody=[];
  function newPhrase(){
    pat=PATTERNS[Math.floor(Math.random()*PATTERNS.length)];
    // melodi ringkas & jarang (ruang untuk berfikir)
    melody=[];for(let i=0;i<32;i++)melody.push(Math.random()<.16?PENTA[Math.floor(Math.random()*PENTA.length)]:0);
  }
  function scheduleStep(s,t){
    const bar=Math.floor(s/8)%4,pos=s%8,[bass,ch]=CHORDS[bar];
    if(pos===0){ // pad lembut + bass
      ch.slice(0,3).forEach((m,k)=>note(musicBus,m,t,STEP*8.2,{type:"triangle",vol:.035,att:.5,cut:900,detune:k*4-4}));
      note(musicBus,bass,t,STEP*3.5,{type:"sine",vol:.16,att:.02});
    }
    if(pos===4) note(musicBus,bass+7,t,STEP*3,{type:"sine",vol:.09,att:.02});
    mallet(musicBus,ch[pat[pos]],t,pos%2?.06:.085,.7);         // arpeggio (detik jam yang stabil)
    const m=melody[s%32];if(m&&loop%2===1) mallet(musicBus,m,t+.01,.07,1.2); // melodi muncul setiap pusingan ke-2
    if(pos%2===1) noise(musicBus,t,.04,.012,7000);              // hi-hat sangat perlahan
    if(pos===0&&bar===0&&s%32===0){loop++;if(loop%2===1)newPhrase()}
  }
  function tick(){
    if(!ctx||!playing)return;
    while(nextT<ctx.currentTime+.15){scheduleStep(step,nextT);step++;nextT+=STEP}
  }
  function startMusic(){
    wantMusic=true;if(!musicOn)return;init();if(!ctx||playing)return;
    playing=true;newPhrase();step=0;nextT=ctx.currentTime+.08;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0,ctx.currentTime);musicBus.gain.linearRampToValueAtTime(MUSIC_VOL,ctx.currentTime+2);
    timer=setInterval(tick,25);
  }
  function stopMusic(fade=.8){
    if(!ctx||!playing)return;playing=false;
    const t=ctx.currentTime;musicBus.gain.cancelScheduledValues(t);
    musicBus.gain.setValueAtTime(musicBus.gain.value,t);musicBus.gain.linearRampToValueAtTime(0,t+fade);
    setTimeout(()=>{if(!playing)clearInterval(timer)},fade*1000+50);
  }
  function duck(len=1){ // perlahankan muzik sekejap supaya SFX jelas
    if(!ctx||!playing)return;const t=ctx.currentTime,g=musicBus.gain;
    g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(MUSIC_VOL*.3,t+.06);
    g.setValueAtTime(MUSIC_VOL*.3,t+len);g.linearRampToValueAtTime(MUSIC_VOL,t+len+.8);
  }

  /* ---- KESAN BUNYI ---- */
  const FX={
    pick(t){mallet(sfxBus,79,t,.18,.25);note(sfxBus,86,t+.04,.12,{vol:.05})},          // "tik" pilih jawapan
    type(t){note(sfxBus,88,t,.05,{type:"triangle",vol:.05})},                           // taip nombor/huruf
    question(t){ // motif "hmm?" — dua not naik seperti soalan → cetus rasa ingin tahu
      mallet(sfxBus,67,t,.13,.5);mallet(sfxBus,72,t+.16,.13,.5);mallet(sfxBus,74,t+.32,.15,.9);
      note(sfxBus,86,t+.32,.6,{vol:.03})},
    hint(t){ // mentol menyala ✨ — kilauan naik
      [76,79,83,88,91].forEach((m,k)=>note(sfxBus,m,t+k*.06,.5,{type:"triangle",vol:.08}));
      glide(sfxBus,600,1800,t,.35,.04)},
    check(t){ // "drumroll" kecil — debaran sebelum keputusan
      for(let k=0;k<6;k++)noise(sfxBus,t+k*.045,.05,.05+k*.012,2500,"bandpass")},
    correct(t){ // 🎉 arpeggio ceria + kilauan
      [72,76,79,84].forEach((m,k)=>mallet(sfxBus,m,t+.25+k*.09,.2,.7));
      note(sfxBus,88,t+.62,1,{type:"triangle",vol:.07});note(sfxBus,91,t+.7,1,{type:"triangle",vol:.05});
      noise(sfxBus,t+.6,.5,.03,8000)},
    partial(t){ // 👍 hampir — naik tapi tak sampai penuh
      [72,76,79].forEach((m,k)=>mallet(sfxBus,m,t+.25+k*.1,.17,.6));mallet(sfxBus,77,t+.6,.12,.7)},
    wrong(t){ // 😅 lembut, tak menakutkan — "bwomp" turun + boing
      glide(sfxBus,330,180,t+.25,.45,.14,"triangle");glide(sfxBus,220,150,t+.5,.4,.1,"sine");
      note(sfxBus,64,t+.95,.3,{type:"sine",vol:.06})},
    next(t){ // whoosh ke soalan baharu
      glide(sfxBus,300,900,t,.22,.04,"sine");noise(sfxBus,t,.25,.035,1500,"bandpass")},
    start(t){[60,64,67,72,76].forEach((m,k)=>mallet(sfxBus,m,t+k*.08,.18,.6))},
    finish(t){ // 🏆 fanfare
      [[60,0],[64,.12],[67,.24],[72,.36],[67,.6],[72,.72]].forEach(([m,d])=>{mallet(sfxBus,m,t+d,.2,.6);note(sfxBus,m-12,t+d,.4,{type:"triangle",vol:.05})});
      [72,76,79,84].forEach(m=>note(sfxBus,m,t+.9,1.8,{type:"triangle",vol:.05,att:.05}));noise(sfxBus,t+.9,1,.03,8000)},
    hover(t){note(sfxBus,84,t,.08,{type:"sine",vol:.035})}
  };
  const DUCK={correct:1.6,partial:1.4,wrong:1.6,finish:2.8,hint:.8,question:1};
  function play(name){
    if(!sfxOn)return;init();if(!ctx||!FX[name])return;
    FX[name](ctx.currentTime+.01);if(DUCK[name])duck(DUCK[name]);
  }

  /* ---- butang kawalan ---- */
  function ui(){
    const w=document.createElement("div");w.className="sk-ctrl";
    w.innerHTML=`<button type="button" class="mus" id="skMus" aria-label="Muzik latar" title="Muzik latar">🎵</button>
                 <button type="button" id="skSfx" aria-label="Kesan bunyi" title="Kesan bunyi">🔊</button>`;
    document.body.appendChild(w);
    const bm=w.querySelector("#skMus"),bs=w.querySelector("#skSfx");
    const paint=()=>{bm.className="mus "+(musicOn?"on":"off");bs.className=sfxOn?"on":"off";bs.textContent=sfxOn?"🔊":"🔇"};
    bm.onclick=()=>{musicOn=!musicOn;store.set("music",musicOn);
      if(musicOn){wantMusic=true;startMusic()}else stopMusic(.4);paint()};
    bs.onclick=()=>{sfxOn=!sfxOn;store.set("sfx",sfxOn);init();
      if(ctx)sfxBus.gain.setTargetAtTime(sfxOn?.55:0,ctx.currentTime,.02);if(sfxOn)play("pick");paint()};
    paint();
  }
  if(document.body)ui();else document.addEventListener("DOMContentLoaded",ui);

  /* pilih jawapan & taip → bunyi automatik */
  document.addEventListener("click",e=>{
    const b=e.target.closest(".opt,.w,.choice,.step,.chip,.tab,.bbtns button");
    if(b&&!b.disabled)play("pick");
  },true);
  document.addEventListener("input",e=>{if(e.target.matches("input"))play("type")},true);

  /* hentikan muzik bila tab disembunyi, sambung bila kembali */
  document.addEventListener("visibilitychange",()=>{
    if(!ctx)return;if(document.hidden)ctx.suspend();else ctx.resume();
  });

  window.SFX={play,startMusic,stopMusic,
    begin(){init();play("start");setTimeout(startMusic,500)}, // dipanggil bila murid tekan "Mula"
    result(k){play("check");play(k)},                       // k = "correct" | "partial" | "wrong"
    nextQ(){play("next");setTimeout(()=>play("question"),260)},
    hint(){play("hint")},
    end(){play("finish");stopMusic(2.5)}};
})();
</script>

<style>
.rk-back{position:fixed;inset:0;z-index:10000;background:rgba(15,23,60,.72);display:flex;align-items:center;justify-content:center;padding:16px;animation:rkFade .25s both}
.rk-box{background:#fffbea;border:5px solid #111;border-radius:30px;box-shadow:0 12px 0 #111;padding:22px 26px 26px;width:100%;max-width:560px;text-align:center;font-family:inherit;animation:rkPop .45s both}
.rk-box .rk-emo{font-size:76px;line-height:1;display:inline-block;animation:rkFloat 2.4s ease-in-out infinite}
.rk-box h2{font-size:38px;margin:6px 0 14px;line-height:1.15}
.rk-box input{width:100%;font:inherit;font-size:32px;font-weight:600;text-align:center;padding:12px 14px;border:4px solid #111;border-radius:20px;background:#fff;outline:none}
.rk-box input:focus{box-shadow:0 0 0 5px #ffd23f}
.rk-box .rk-go{margin-top:18px;width:100%;font:inherit;font-size:40px;font-weight:700;color:#fff;background:#22c55e;border:4px solid #111;border-radius:22px;padding:6px 14px 10px;box-shadow:0 6px 0 #118a3e;cursor:pointer}
.rk-box .rk-go:disabled{opacity:.45;cursor:not-allowed}
.rk-box .rk-go:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #118a3e}
.rk-box.rk-shake{animation:rkShake .45s}
.rk-status{margin:16px auto 0;max-width:560px;background:#fffbea;border:4px solid #111;border-radius:20px;padding:8px 16px;font-size:22px;font-weight:600;text-align:center}
@keyframes rkFade{from{opacity:0}}
@keyframes rkPop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes rkFloat{50%{transform:translateY(-8px)}}
@keyframes rkShake{20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@media (max-width:620px){.rk-box h2{font-size:30px}.rk-box input{font-size:26px}.rk-box .rk-go{font-size:32px}.rk-box .rk-emo{font-size:60px}}
</style>
<script>
(function(){
  /* ============ TETAPAN CIKGU ============
     Tampal URL Web App Apps Script di bawah (berakhir dengan /exec).
     Kalau kosong, latihan tetap jalan tapi markah tidak dihantar. */
  const REKOD_URL = "https://script.google.com/macros/s/AKfycbxZZbEEw1IXk9OXuPDb8Q6xHzFt1rWlV0K9Xnkuy9G3KIa-x5Oat1MYFBtvTsvhar7_/exec";
  /* ======================================= */

  const SUBJEK = "Bahasa Inggeris";
  const BAHASA = "en"; // "ms" atau "en"
  const T = BAHASA==="en"
    ? {tanya:"What is your name?",ph:"Type your full name",go:"Let's go! 🚀",ok:"📨 Your score has been sent to your teacher!",q:"📶 No internet. Your score will be sent next time.",hi:"Well done"}
    : {tanya:"Siapa nama kamu?",ph:"Tulis nama penuh",go:"Jom Mula! 🚀",ok:"📨 Markah kamu sudah dihantar kepada cikgu!",q:"📶 Tiada internet. Markah akan dihantar kemudian.",hi:"Tahniah"};
  const QKEY="rekod_baris_tertunda";
  let nama="", butiran=[], mulaMasa=null, dihantar=false;
  const adaURL=()=>/^https:\/\/script\.google(usercontent)?\.com\//.test(REKOD_URL);

  function bersih(s){return String(s||"").replace(/[<>]/g,"").replace(/\s+/g," ").trim().slice(0,60)
    .toLowerCase().replace(/(^|\s|-)(\S)/g,(m,a,b)=>a+b.toUpperCase())
    .replace(/(^|\s)(Bin|Binti|Bt|A\/l|A\/p)(?=\s|$)/g,(m,a,b)=>a+b.toLowerCase())}

  /* --- skrin nama --- */
  function mula(fn){
    const back=document.createElement("div");back.className="rk-back";
    back.innerHTML=`<form class="rk-box" autocomplete="off"><span class="rk-emo">🧒</span><h2>${T.tanya}</h2>
      <input id="rkNama" maxlength="60" placeholder="${T.ph}" aria-label="${T.tanya}">
      <button class="rk-go" type="submit" disabled>${T.go}</button></form>`;
    document.body.appendChild(back);
    const f=back.querySelector("form"),inp=back.querySelector("input"),b=back.querySelector("button");
    inp.addEventListener("input",()=>{b.disabled=bersih(inp.value).length<2});
    f.addEventListener("submit",e=>{e.preventDefault();
      const n=bersih(inp.value);
      if(n.length<2){f.classList.remove("rk-shake");void f.offsetWidth;f.classList.add("rk-shake");return}
      nama=n;butiran=[];dihantar=false;mulaMasa=new Date();back.remove();fn&&fn();});
    setTimeout(()=>inp.focus(),80);
  }

  /* --- kenal pasti jenis kesilapan ---
     frac   : bahagian markah yang diperoleh (0–1)
     j      : jenis lalai soalan ("kecuaian" | "konsep" | "fakta")
     t      : jenis khas ikut pilihan salah, cth {2:"kecuaian"}
     pilih  : indeks pilihan murid (soalan aneka pilihan)
     hampir : true kalau jawapan hampir tepat (cth 1 huruf / 1 digit salah)
     Peraturan: separuh markah atau lebih / hampir tepat → kecuaian. */
  function jenis(o){
    if(o.frac>=1) return "";
    if(o.frac>=0.5||o.hampir) return "kecuaian";
    if(o.t&&o.pilih!=null&&o.t[o.pilih]) return o.t[o.pilih];
    return o.j||"konsep";
  }

  function catat(no,got,max,jenisSalah){
    butiran.push({no:String(no),g:Math.round(got*100)/100,m:max,j:jenisSalah||""});
  }

  /* --- hantar --- */
  function hantarSatu(baris){
    return fetch(REKOD_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(baris)});
  }
  function tertunda(){try{return JSON.parse(localStorage.getItem(QKEY)||"[]")}catch(e){return[]}}
  function simpanTertunda(a){try{localStorage.setItem(QKEY,JSON.stringify(a.slice(-50)))}catch(e){}}
  async function hantarTertunda(){
    if(!adaURL()||!navigator.onLine)return;
    const a=tertunda();if(!a.length)return;
    const baki=[];
    for(const r of a){try{await hantarSatu(r)}catch(e){baki.push(r)}}
    simpanTertunda(baki);
  }

  /* dipanggil di skrin keputusan: pulangkan elemen status untuk dipaparkan */
  function selesai(markah){
    const el=document.createElement("div");el.className="rk-status";
    if(!nama){el.remove();return el}
    el.textContent=`${T.hi}, ${nama}! 🎉`;
    if(dihantar||!adaURL())return el;
    dihantar=true;
    const baris={versi:1,nama,subjek:SUBJEK,markah:Math.round(markah),
      mula:mulaMasa?mulaMasa.toISOString():"",tamat:new Date().toISOString(),butiran};
    const papar=t=>{el.innerHTML=`${T.hi}, ${nama}! 🎉<br>${t}`};
    if(!navigator.onLine){simpanTertunda([...tertunda(),baris]);papar(T.q);return el}
    hantarSatu(baris).then(()=>papar(T.ok)).catch(()=>{simpanTertunda([...tertunda(),baris]);papar(T.q)});
    return el;
  }

  window.addEventListener("online",hantarTertunda);
  window.addEventListener("load",()=>setTimeout(hantarTertunda,1500));
  window.REKOD={mula,jenis,catat,selesai,get nama(){return nama}};
})();
</script>
<!-- ===== /REKOD-KIT ===== -->

let ac;
function tone(freqs){
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(.15, ac.currentTime + i*.12);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + i*.12 + .25);
      o.connect(g); g.connect(ac.destination);
      o.start(ac.currentTime + i*.12); o.stop(ac.currentTime + i*.12 + .3);
    });
  }catch(e){}
}

/* ---------- ANIMATIONS ---------- */
function confetti(){
  const c = ["#ff5d5d","#ffd93d","#2ec27e","#4d96ff","#9b5de5","#ff9f1c"];
  for(let i=0;i<40;i++){
    const d = document.createElement("div");
    d.className = "confetti";
    d.style.left = Math.random()*100 + "vw";
    d.style.background = c[i % c.length];
    d.style.animationDelay = Math.random()*.4 + "s";
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 2400);
  }
}
function floaty(e){
  const d = document.createElement("div");
  d.className = "floaty"; d.textContent = e;
  d.style.left = "50%"; d.style.top = "45%"; d.style.marginLeft = "-30px";
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 1300);
}

    <div class="sub">Year 4 • Bahasa Inggeris</div>

function stimHTML(q){
  if(!q.st) return "";
  if(q.st.startsWith("adam")) return `<div class="stim">${S.adam(+q.st.slice(4))}</div>`;
  if(q.st === "stories"){
    return `<div class="stim"><div class="tabs">${["A","B","C"].map(k=>`<button class="tab ${k===tab?"on":""}" onclick="setTab('${k}')">Story ${k}</button>`).join("")}</div><div id="storyBody">${S.stories[tab]}</div></div>`;
  }
  return `<div class="stim">${S[q.st]}</div>`;
}
function zoom(el){
  const z=document.createElement("div"); z.className="zoom";
  z.innerHTML=`<img src="${el.src}" alt="${el.alt.replace(/"/g,"&quot;")}"><span>✖</span>`;
  z.onclick=()=>z.remove(); document.body.appendChild(z);
}
function setTab(k){
  tab = k;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on", b.textContent.endsWith(k)));
  document.getElementById("storyBody").innerHTML = S.stories[k];
}

function render(){
  const q = Q[idx], P = PARTS[q.p];
  sel = null; done = false; hintUsed = false;
  if(q.p === 4 && (idx === 0 || Q[idx-1].p !== 4)) tab = "A";

  let body;
  if(q.w){
    const boxes = q.w.split("").map((ch,i)=> i===0
      ? `<input class="lb fixed" value="${ch}" disabled>`
      : `<input class="lb" maxlength="1" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false">`).join("");
    body = `<div class="spell" id="spell">${boxes}</div>`;
  } else {
    body = `<div class="opts ${q.o.length%2?"odd":""}">${q.o.map((t,i)=>{
      const story = Array.isArray(t);
      const txt = story ? `<span class="L">${t[0]}</span><span>${t[1]}</span>` : `<span>${t}</span>`;
      return `<button class="opt" data-i="${i}" onclick="pick(${i})">${txt}</button>`;
    }).join("")}</div>`;
  }

  app.innerHTML = `
    <div class="top">
      <span class="pill">${P.emoji} ${P.name}</span>
      <div class="bar"><i style="width:${idx/Q.length*100}%"></i></div>
      <span class="pill score">⭐ ${Math.round(score)}%</span>
    </div>
    ${stimHTML(q)}
    <div class="qwrap">
      <div class="qpanel" id="card">
        <div class="qhead">
          <span class="qlabel">Question ${idx+1} <small>/ ${Q.length}</small></span>
          <div class="instr-line">${P.instr}</div>
          <div class="qtext">${q.w?"🐾 ":""}${q.q}</div>
          <div class="hintbox" id="hintArea"></div>
        </div>
        ${body}
        <div class="fb" id="fb"></div>
        <button class="hint-tab" id="hintBtn" onclick="showHint()"><span class="bulb">💡</span><span id="hintLbl">Petunjuk</span></button>
        <button class="semak" id="checkBtn" onclick="check()" disabled>Semak</button>
      </div>
    </div>`;

  if(q.w) setupSpell();
  window.scrollTo({top:0, behavior:"smooth"});
}

function setupSpell(){
  const ins = [...document.querySelectorAll("#spell .lb:not(.fixed)")];
  ins.forEach((el,k)=>{
    el.addEventListener("input", ()=>{
      el.value = el.value.replace(/[^a-zA-Z]/g,"").toLowerCase().slice(-1);
      if(el.value && ins[k+1]) ins[k+1].focus();
      document.getElementById("checkBtn").disabled = !ins.every(x=>x.value);
    });
    el.addEventListener("keydown", e=>{
      if(e.key === "Backspace" && !el.value && ins[k-1]){ ins[k-1].focus(); }
      if(e.key === "Enter" && ins.every(x=>x.value)) check();
    });
  });
  ins[0].focus();
}

function pick(i){
  if(done) return;
  sel = i;
  document.querySelectorAll(".opt").forEach(b=>b.classList.toggle("sel", +b.dataset.i === i));
  document.getElementById("checkBtn").disabled = false;
}

function showHint(){
  if(hintUsed || done) return;
  hintUsed = true;
  const h = document.getElementById("hintArea");
  h.innerHTML = `💡 ${Q[idx].h}`; h.classList.add("show");
  document.getElementById("hintBtn").disabled = true;
  document.getElementById("hintLbl").textContent = "Dah guna"; SFX.hint();
}

function burst(e){
  const d = document.createElement("div");
  d.className = "burst"; d.textContent = e;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 1300);
}

function check(){
  if(done) return;
  const q = Q[idx];
  let ok;
  if(q.w){
    const ins = [...document.querySelectorAll("#spell .lb:not(.fixed)")];
    if(!ins.every(x=>x.value)) return;
    const word = q.w[0] + ins.map(x=>x.value).join("");
    ok = word.toLowerCase() === q.w;
    ins.forEach(x=>x.disabled = true);
    document.getElementById("spell").classList.add(ok ? "ok" : "bad");
  } else {
    if(sel === null) return;
    ok = sel === q.a;
    document.querySelectorAll(".opt").forEach(b=>{
      b.disabled = true;
      if(+b.dataset.i === sel){ b.classList.remove("sel"); b.classList.add(ok ? "ok" : "bad"); }
      else if(!ok && TUNJUK_JAWAPAN && +b.dataset.i === q.a) b.classList.add("ok","reveal");
    });
  }
  done = true;
  res.push({p:q.p, ok});
  if(ok) score += PTS;
  const taip = q.w ? (q.w[0]+[...document.querySelectorAll("#spell .lb:not(.fixed)")].map(x=>x.value).join("")).toLowerCase() : "";
  REKOD.catat(idx+1, ok?PTS:0, PTS, REKOD.jenis({frac:ok?1:0, j:q.j, t:q.t, pilih:q.w?null:sel, hampir:!!q.w&&bezaSatu(q.w,taip)}));

  const fb = document.getElementById("fb"), card = document.getElementById("card");
  document.getElementById("hintBtn").disabled = true;
  if(ok){
    const m = ["Great job!","Awesome!","You got it!","Super star!","Well done!"];
    fb.className = "fb show ok";
    fb.innerHTML = `<span class="emo">🌟</span><span><span class="head">${m[Math.floor(Math.random()*m.length)]}</span>+4 marks</span>`;
    card.classList.add("okfx"); confetti(); burst("⭐"); SFX.result("correct");
  } else {
    const m = ["Oops! Keep going!","Nice try! Next one!","Don't give up!"];
    fb.className = "fb show bad";
    fb.innerHTML = `<span class="emo">💪</span><span><span class="head">${m[Math.floor(Math.random()*m.length)]}</span>${TUNJUK_JAWAPAN?`<div class="ans">✅ Answer: <b>${q.w ? q.w : (Array.isArray(q.o[q.a]) ? q.o[q.a].join(" – ") : q.o[q.a])}</b></div>`:"Let's try the next one!"}</span>`;
    card.classList.add("badfx"); burst("💨"); SFX.result("wrong");
  }
  document.querySelector(".score").textContent = `⭐ ${Math.round(score)}%`;
  const b = document.getElementById("checkBtn");
  b.className = "semak next"; b.disabled = false; b.onclick = next;
  b.textContent = idx < Q.length-1 ? "Next ➜" : "See My Score 🏆";
}

function next(){
  idx++;
  if(idx < Q.length){ render(); SFX.nextQ(); } else finish();
}

function finish(){
  const s = Math.round(score);
  const n = s >= 80 ? 3 : s >= 50 ? 2 : 1;
  const msg = s >= 80 ? "Amazing! You are an English star! 🌟" : s >= 50 ? "Good work! Keep practising! 💪" : "Nice try! Practice makes perfect! 🌈";
  const parts = [1,2,3,4,5].map(p=>{
    const r = res.filter(x=>x.p===p);
    return `<div><span>${PARTS[p].emoji} ${PARTS[p].name}</span><span>${r.filter(x=>x.ok).length} / ${r.length}</span></div>`;
  }).join("");
  app.innerHTML = `<div class="kad hero">
    <div class="mascot">🏆</div>
    <h1>All Done!</h1>
    <div class="stars">${[0,1,2].map(i=>`<span style="animation-delay:${i*.25}s;${i<n?"":"filter:grayscale(1);opacity:.35"}">⭐</span>`).join("")}</div>
    <div class="bigscore">${s}%</div>
    <div style="font-size:26px;font-weight:700">${msg}</div>
    <div class="sumlist">${parts}</div>
    <div class="dots">${res.map((r,i)=>`<span style="background:${r.ok?"var(--ok)":"var(--bad)"}">${i+1}</span>`).join("")}</div>
  </div>`;
  if(s >= 50) confetti();
  SFX.end();
  app.querySelector(".hero").appendChild(REKOD.selesai(s));
  window.scrollTo({top:0, behavior:"smooth"});
}

start();
</script>
</body>
</html>
