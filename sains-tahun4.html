<title>Latihan Sains Tahun 4</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== TEMA KAD KARTUN (ikut rujukan) ===== */
:root{
  --navy:#213a7c; --blue:#0b52c4; --blue-d:#073e9a; --lav:#d0d9ff; --lav2:#eef1ff; --ink:#111;
  --c1:#ef7a5c; --c2:#f2e36b; --c3:#7fdc6c; --c4:#ef6fd6;
  --ok:#22c55e; --ok-d:#118a3e; --okbg:#dcfce7; --bad:#ff4d5e; --bad-d:#c81e3a; --badbg:#ffe1e5;
  --sun:#ffd23f; --muted:#3b3f73;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Fredoka","Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  background:var(--navy); color:var(--ink); font-size:24px; line-height:1.35; min-height:100vh;
  overflow-x:hidden; font-weight:500;
}
button{font-family:inherit}
.wrap{max-width:1500px;margin:0 auto;padding:18px 16px 110px}
.hidden{display:none!important}
.center{text-align:center}

/* kad lavender berlapis (macam dalam gambar) */
.kad{background:var(--lav);border:4px solid var(--ink);border-radius:30px;padding:20px 24px;
  box-shadow:0 12px 0 0 var(--lav),0 12px 0 4px var(--ink);margin-bottom:30px;position:relative}

/* bar atas */
.top{display:flex;align-items:center;gap:12px;margin:0 0 22px;flex-wrap:wrap}
.top .pill{background:var(--lav);border:4px solid var(--ink);border-radius:999px;padding:4px 18px;font-weight:700;font-size:22px;white-space:nowrap}
.top .bar{flex:1;min-width:120px;height:24px;background:var(--lav2);border:4px solid var(--ink);border-radius:999px;overflow:hidden}
.top .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c3),var(--c2));transition:width .5s}

/* kad bahan / petikan */
.stim{background:var(--lav);border:4px solid var(--ink);border-radius:30px;padding:18px 24px;
  box-shadow:0 12px 0 0 var(--lav),0 12px 0 4px var(--ink);margin:0 0 34px;font-size:25px;font-weight:600;line-height:1.4;
  max-height:52vh;overflow:auto;animation:slideIn .45s both}
.stim .stitle,.stim > b:first-child{display:block;text-align:center;font-weight:700;font-size:30px;margin-bottom:6px}
.stim p{margin:6px 0}
.stim img{max-width:100%;border-radius:14px;display:block;margin:8px auto 0;background:#fff;border:3px solid var(--ink)}

/* panel soalan biru */
.qwrap{position:relative;margin:0 130px 30px 90px}
.qpanel{position:relative;background:var(--blue);border:4px solid var(--ink);border-radius:32px;padding:14px 18px 22px;
  box-shadow:0 14px 0 0 var(--blue),0 14px 0 4px var(--ink);display:flex;flex-direction:column;gap:16px;animation:slideIn .45s .05s both}
.qhead{background:var(--lav);border:4px solid var(--ink);border-radius:26px;padding:12px 18px 18px;
  box-shadow:0 12px 0 0 var(--lav),0 12px 0 4px var(--ink);margin-bottom:14px;text-align:center}
.qlabel{display:block;border:4px solid var(--ink);border-radius:999px;padding:2px 14px;font-size:24px;font-weight:500;background:var(--lav2);margin-bottom:12px}
.qlabel small{font-size:18px;font-weight:600;opacity:.75}
.qtext{font-size:32px;font-weight:500;line-height:1.3}
.qtext .box,.qhead .box{border:3px solid var(--ink);border-radius:16px;background:var(--lav2);padding:10px 14px;margin:10px 0;text-align:left;font-size:25px}
.qhead .visual{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:12px}
.qhead .visual svg{max-width:100%;height:auto;background:#fff;border-radius:14px}
.qhead .bigq{font-size:40px;font-weight:700;color:var(--blue);margin-top:8px}
.qhead .instr{font-size:20px;font-weight:600;color:#3b3f73;margin-top:8px}

/* pilihan jawapan grid 2x2 */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.opts.one{grid-template-columns:1fr}
.opt{display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;width:100%;min-height:76px;
  background:var(--blue);color:var(--lav2);border:5px solid var(--c1);border-radius:26px;padding:10px 16px;
  font-size:27px;font-weight:500;line-height:1.2;cursor:pointer;transition:transform .15s,background .15s,color .15s,box-shadow .15s}
.opts > .opt:nth-child(4n+2){border-color:var(--c2)}
.opts > .opt:nth-child(4n+3){border-color:var(--c3)}
.opts > .opt:nth-child(4n+4){border-color:var(--c4)}
.opt:hover:not(:disabled){transform:translateY(-3px) scale(1.02)}
.opt .k,.opt .L,.opt .let{flex:none;width:40px;height:40px;border-radius:50%;background:var(--lav2);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:22px}
.opt.sel{background:var(--lav2);color:var(--ink);box-shadow:0 0 0 4px var(--ink) inset;transform:scale(1.03)}
.opt.sel .k,.opt.sel .L,.opt.sel .let{background:var(--blue);color:#fff}
.opt.ok,.opt.right{background:var(--ok)!important;color:#fff!important;border-color:var(--ink)!important;animation:pop .55s}
.opt.bad,.opt.wrong{background:var(--bad)!important;color:#fff!important;border-color:var(--ink)!important;animation:shake .5s}
.opt.ok .k,.opt.right .let,.opt.ok .L,.opt.bad .k,.opt.wrong .let,.opt.bad .L{background:#fff;color:var(--ink)}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.bad):not(.right):not(.wrong):not(.sel){opacity:.55}

/* butang Semak besar */
.semak{order:10;width:100%;background:var(--blue);border:4px solid var(--ink);border-radius:26px;padding:6px 18px 10px;
  color:var(--lav);font-size:54px;font-weight:700;line-height:1.1;cursor:pointer;letter-spacing:.5px;
  text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 4px 0 var(--ink);
  box-shadow:0 6px 0 var(--blue-d);transition:transform .1s,filter .15s}
.semak:hover:not(:disabled){filter:brightness(1.12)}
.semak:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--blue-d)}
.semak:disabled{opacity:.5;cursor:not-allowed}
.semak.next{background:var(--ok);box-shadow:0 6px 0 var(--ok-d);color:#fff;animation:pop .4s}

/* tab Petunjuk di sebelah kanan */
.hint-tab{position:absolute;left:100%;top:56%;width:112px;padding:10px 6px 10px 2px;margin-left:-2px;
  background:var(--lav2);border:4px solid var(--ink);border-left:none;border-radius:0 24px 24px 0;
  box-shadow:0 10px 0 0 var(--lav2),0 10px 0 4px var(--ink);cursor:pointer;text-align:center;font-size:18px;font-weight:600;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s;z-index:2}
.hint-tab .bulb{font-size:58px;line-height:1;display:block;animation:glow 2s ease-in-out infinite}
.hint-tab:hover:not(:disabled){transform:translateX(4px)}
.hint-tab:disabled{cursor:default}
.hint-tab:disabled .bulb{animation:none;filter:grayscale(1);opacity:.45}
.hintbox{display:none;background:#fff6c2;border:4px solid var(--ink);border-radius:20px;padding:10px 16px;margin-top:14px;
  font-size:24px;font-weight:600;text-align:left;animation:pop .4s}
.hintbox.show{display:block}

/* maklum balas */
.fb{display:none;order:9;background:var(--lav2);border:4px solid var(--ink);border-radius:24px;padding:12px 18px;
  font-size:26px;font-weight:600;align-items:center;gap:14px}
.fb.show{display:flex}
.fb .emo{font-size:58px;line-height:1;flex:none}
.fb.ok{background:var(--okbg);animation:pop .5s}
.fb.ok .emo{animation:spin 1s ease}
.fb.bad,.fb.no{background:var(--badbg);animation:shake .5s}
.fb.mid{background:#fff4cf;animation:pop .5s}
.fb .head{font-size:30px;font-weight:700;display:block}
.fb .sol,.fb .ans{font-size:22px;font-weight:500;margin-top:4px}

/* skrin mula & tamat */
.hero{text-align:center;max-width:820px;margin:20px auto 30px}
.hero h1{font-size:46px;line-height:1.1;margin:6px 0;font-weight:700}
.hero .mascot{font-size:88px;line-height:1;display:inline-block;animation:float 2.4s ease-in-out infinite}
.hero .sub{font-size:24px;font-weight:600;color:#3b3f73}
.steps{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0}
.steps span{background:var(--lav2);border:3px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:19px;font-weight:600}
.rules{font-size:22px;font-weight:500;margin:10px 0 18px}
.hero .semak{max-width:460px;font-size:44px}
.bigscore{font-size:88px;font-weight:700;color:var(--blue);line-height:1}
.stars{font-size:58px;letter-spacing:6px}
.stars span{display:inline-block;animation:pop .6s both}
.sumlist{display:grid;gap:8px;margin-top:16px;text-align:left}
.sumlist div{display:flex;justify-content:space-between;background:var(--lav2);border:3px solid var(--ink);border-radius:16px;padding:6px 16px;font-weight:600;font-size:21px}
.dots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.dots span{width:52px;height:52px;border-radius:14px;border:3px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff}

/* animasi */
@keyframes pop{0%{transform:scale(.6);opacity:.2}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(6px)}}
@keyframes spin{0%{transform:rotate(0) scale(.5)}60%{transform:rotate(380deg) scale(1.3)}100%{transform:rotate(360deg) scale(1)}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes glow{50%{transform:scale(1.08) rotate(-6deg);filter:drop-shadow(0 0 10px #ffd23f)}}
@keyframes slideIn{from{opacity:0;transform:translateY(24px)}}
@keyframes bounceIn{0%{transform:scale(1)}30%{transform:scale(1.03)}60%{transform:scale(.99)}100%{transform:scale(1)}}
.qpanel.okfx{animation:bounceIn .6s}
.qpanel.badfx{animation:shake .5s}
.confetti{position:fixed;top:-20px;width:14px;height:20px;border-radius:4px;pointer-events:none;z-index:99;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.burst{position:fixed;left:50%;top:42%;font-size:90px;pointer-events:none;z-index:99;transform:translate(-50%,-50%);animation:burstUp 1.2s ease-out forwards}
@keyframes burstUp{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}25%{transform:translate(-50%,-50%) scale(1.25);opacity:1}100%{transform:translate(-50%,-160%) scale(1);opacity:0}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:98;animation:flashR .6s forwards}
@keyframes flashR{0%{background:rgba(255,77,94,.35)}100%{background:transparent}}

/* telefon / tablet kecil */
@media (max-width:900px){
  .qwrap{margin:0 0 30px}
  .hint-tab{position:static;order:8;width:auto;flex-direction:row;justify-content:center;gap:10px;margin:0;
    border-left:4px solid var(--ink);border-radius:22px;padding:6px 14px;font-size:22px;box-shadow:0 6px 0 0 var(--ink)}
  .hint-tab .bulb{font-size:40px}
  .hint-tab:hover:not(:disabled){transform:none}
}
@media (max-width:620px){
  body{font-size:21px}
  .wrap{padding:12px 12px 100px}
  .stim{font-size:21px;padding:14px 16px;border-radius:24px}
  .stim .stitle,.stim > b:first-child{font-size:25px}
  .qpanel{padding:10px 12px 18px;border-radius:26px}
  .qtext{font-size:25px}
  .qlabel{font-size:20px}
  .opts{grid-template-columns:1fr;gap:12px}
  .opt{font-size:22px;min-height:62px;border-radius:22px}
  .semak{font-size:40px}
  .hero h1{font-size:34px}
  .bigscore{font-size:68px}
  .fb{font-size:22px}.fb .emo{font-size:44px}.fb .head{font-size:25px}
}
.opts.odd > .opt:last-child{grid-column:1/-1}
.fb > span:last-child{min-width:0;flex:1}
.fb .sol{overflow-x:auto;max-width:100%}
@media (max-width:620px){.fb{flex-wrap:wrap;justify-content:center;text-align:center}}
/* jawapan betul yang didedahkan bila murid salah */
.opt.reveal{animation:pop .55s .35s both}
.opt.miss,.w.miss{background:var(--okbg)!important;color:var(--ink)!important;border:5px dashed var(--ok-d)!important;opacity:1!important}
.w.ok.reveal{animation:pop .55s .35s both}
/* ikon subjek */
.hero img.logo{width:230px;height:230px;object-fit:contain;display:block;margin:-6px auto 4px;animation:float 2.6s ease-in-out infinite;filter:drop-shadow(0 6px 0 rgba(0,0,0,.18))}
@media (max-width:620px){.hero img.logo{width:170px;height:170px}}

/* ---- khas Sains ---- */
:root{--pri:#6c5ce7;--pri2:#a29bfe;--line:#c7cdf0;--mid:#ffb300;--midbg:#fff4cf;--sel:#74b9ff;--selbg:#e6f3ff;--hint:#ffd93d;--hintbg:#fffbe6}
.opt .two{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.opt .two span{background:rgba(255,255,255,.16);border-radius:12px;padding:0 10px}
.opt .two b{color:var(--c2)}
.opt.sel .two span,.opt.right .two span,.opt.wrong .two span{background:rgba(0,0,0,.08)}
.opt.sel .two b{color:var(--blue)}
.opt.right .two b,.opt.wrong .two b{color:#fff}
.row{background:var(--lav2);border:5px solid var(--c1);border-radius:24px;padding:10px 14px}
#area > .row:nth-child(4n+2){border-color:var(--c2)}
#area > .row:nth-child(4n+3){border-color:var(--c3)}
#area > .row:nth-child(4n+4){border-color:var(--c4)}
#area > .row + .row{margin-top:12px}
.row.right{border-color:var(--ink);background:var(--okbg);animation:pop .5s}
.row.wrong{border-color:var(--ink);background:var(--badbg);animation:shake .5s}
.rowlab{font-weight:700;font-size:25px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{font-family:inherit;cursor:pointer;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:4px 16px;font-size:22px;font-weight:600;color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.chip.sel{background:var(--blue);color:#fff}
.chip.right{background:var(--ok);color:#fff}
.chip.miss{border-style:dashed;border-color:var(--ok-d);background:var(--okbg)}
.chip.wrong{background:var(--bad);color:#fff}
.chip:disabled{cursor:default}
#area > .chips .chip{background:var(--lav2)}
#area > .chips .chip:disabled{opacity:.5}
.seq{display:flex;gap:10px;min-height:64px;flex-wrap:wrap;background:var(--lav2);border:4px solid var(--ink);border-radius:20px;padding:10px;margin-bottom:12px;align-items:center;justify-content:center}
.seq .slot{width:56px;height:56px;border-radius:16px;border:3px dashed var(--blue);display:grid;place-items:center;font-weight:700;font-size:26px;background:#fff}
.seq .slot.fill{border-style:solid;border-color:var(--ink);color:var(--blue)}
.seq .slot.right{border-color:var(--ink);background:var(--ok);color:#fff}
.seq .slot.wrong{border-color:var(--ink);background:var(--bad);color:#fff}
.arrow{font-size:24px;color:var(--muted)}
.small{font-size:18px;padding:4px 14px}
.builder{display:flex;justify-content:center;gap:22px;align-items:flex-end;padding:12px;flex-wrap:wrap;background:var(--lav2);border:4px solid var(--ink);border-radius:24px}
.bcol{display:flex;flex-direction:column;align-items:center;gap:8px;width:130px}
.btrack{height:240px;width:70px;background:repeating-linear-gradient(to top,#f4f6fb 0 39px,#cfd5ea 39px 40px);border-radius:12px;display:flex;align-items:flex-end;overflow:hidden;border:3px solid var(--ink)}
.bfill{width:100%;background:linear-gradient(var(--c4),#b13fa0);transition:height .25s;border-radius:8px 8px 0 0}
.bval{font-weight:700;font-size:28px;color:var(--blue)}
.bbtns{display:flex;gap:8px}
.bbtns button{width:46px;height:46px;border-radius:50%;font-size:28px;font-weight:700;background:var(--blue);color:#fff;border:3px solid var(--ink);cursor:pointer}
.bbtns button:disabled{opacity:.4;cursor:default}
.blab{font-weight:600;text-align:center;font-size:19px}
.bcol.right .btrack{border-color:var(--ok);box-shadow:0 0 0 4px var(--ok)}
.bcol.wrong .btrack{border-color:var(--bad);box-shadow:0 0 0 4px var(--bad)}
.tree{display:flex;flex-direction:column;align-items:center;gap:6px}
.tree .node{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:4px 14px;font-weight:600;text-align:center}
.tree .kids{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.tree .tag{display:block;font-size:26px;color:var(--blue);font-weight:700}
.tree .stem{font-size:24px;color:var(--muted)}
.tbl{border-collapse:collapse;font-size:22px;background:#fff;border-radius:14px;overflow:hidden}
.tbl th,.tbl td{border:3px solid var(--ink);padding:6px 14px;text-align:center}
.tbl th{background:var(--lav2)}
.pics{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.pic{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 12px;text-align:center;min-width:110px}
.pic .e{font-size:50px;display:block;line-height:1.2}
.pic b{display:block;font-size:22px;color:var(--blue)}
.pic small{font-size:18px;color:var(--muted);font-weight:600}
.dark{filter:grayscale(1);opacity:.45}
.glow{text-shadow:0 0 14px #ffd93d,0 0 26px #ffb300}
.qhead .visual{display:flex;justify-content:center}
@media (max-width:620px){
  .bcol{width:92px}
  .btrack{height:200px;width:56px;background:repeating-linear-gradient(to top,#f4f6fb 0 32px,#cfd5ea 32px 33.3px)}
  .chip{font-size:19px}
}

</style>
</head>

<style>
.sk-ctrl{position:fixed;right:14px;bottom:14px;z-index:9999;display:flex;gap:8px;background:rgba(255,255,255,.92);
  padding:6px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.sk-ctrl button{width:54px;height:54px;border-radius:50%;border:3px solid #e6e8f0;background:#fff;font-size:26px;
  cursor:pointer;transition:transform .15s;line-height:1;font-family:inherit}
.sk-ctrl button:hover{transform:scale(1.08)}
.sk-ctrl button.off{background:#eee;filter:grayscale(1);opacity:.6}
.sk-ctrl button.on.mus{animation:skPulse 1.4s ease-in-out infinite}
@keyframes skPulse{50%{transform:scale(1.07)}}
@media (max-width:520px){.sk-ctrl button{width:46px;height:46px;font-size:22px}}
</style>
<script>
(function(){
  const store={get(k,d){try{const v=localStorage.getItem("sk_"+k);return v===null?d:v==="1"}catch(e){return d}},
               set(k,v){try{localStorage.setItem("sk_"+k,v?"1":"0")}catch(e){}}};
  let ctx=null,master,musicBus,sfxBus,comp,noiseBuf=null,timer=null;
  let musicOn=store.get("music",true),sfxOn=store.get("sfx",true),playing=false,wantMusic=false;
  const MUSIC_VOL=.22,BPM=76,STEP=60/BPM/2; // 1 langkah = not 1/8
  let step=0,nextT=0,loop=0;

  function init(){
    if(ctx) return ctx.state==="suspended"&&ctx.resume();
    try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
    comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;comp.connect(ctx.destination);
    master=ctx.createGain();master.gain.value=.9;master.connect(comp);
    musicBus=ctx.createGain();musicBus.gain.value=0;musicBus.connect(master);
    sfxBus=ctx.createGain();sfxBus.gain.value=sfxOn?.55:0;sfxBus.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*.5,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  const hz=m=>440*Math.pow(2,(m-69)/12);

  /* ---- alat bunyi asas ---- */
  function note(bus,midi,t,dur,{type="sine",vol=.2,att=.008,cut=0,detune=0}={}){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=hz(midi);o.detune.value=detune;
    let out=o;
    if(cut){const f=ctx.createBiquadFilter();f.type="lowpass";f.frequency.value=cut;o.connect(f);out=f}
    out.connect(g);g.connect(bus);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);
    g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.start(t);o.stop(t+dur+.05);
  }
  function mallet(bus,midi,t,vol=.16,dur=.9){ // bunyi seperti marimba/kalimba
    note(bus,midi,t,dur,{type:"sine",vol});
    note(bus,midi+12,t,dur*.35,{type:"sine",vol:vol*.25});
  }
  function noise(bus,t,dur,vol,freq,type="highpass"){
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=noiseBuf;
    f.type=type;f.frequency.value=freq;s.connect(f);f.connect(g);g.connect(bus);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.start(t);s.stop(t+dur+.02);
  }
  function glide(bus,f1,f2,t,dur,vol,type="sine"){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;
    o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    o.connect(g);g.connect(bus);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);
    g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.start(t);o.stop(t+dur+.05);
  }

  /* ---- MUZIK LATAR: tenang, pentatonik, ~76 BPM, tiada lirik → bantu fokus & berfikir ---- */
  // Progresi C – Am – F – G (setiap satu 1 bar = 8 langkah)
  const CHORDS=[[48,[60,64,67,72]],[45,[57,60,64,69]],[41,[57,60,65,69]],[43,[55,59,62,67]]];
  const PENTA=[72,74,76,79,81,84];
  const PATTERNS=[[0,2,1,3,2,1,0,2],[0,1,2,3,2,3,1,2],[3,2,1,0,1,2,3,1],[0,2,3,2,1,2,0,1]];
  let pat=PATTERNS[0],melody=[];
  function newPhrase(){
    pat=PATTERNS[Math.floor(Math.random()*PATTERNS.length)];
    // melodi ringkas & jarang (ruang untuk berfikir)
    melody=[];for(let i=0;i<32;i++)melody.push(Math.random()<.16?PENTA[Math.floor(Math.random()*PENTA.length)]:0);
  }
  function scheduleStep(s,t){
    const bar=Math.floor(s/8)%4,pos=s%8,[bass,ch]=CHORDS[bar];
    if(pos===0){ // pad lembut + bass
      ch.slice(0,3).forEach((m,k)=>note(musicBus,m,t,STEP*8.2,{type:"triangle",vol:.035,att:.5,cut:900,detune:k*4-4}));
      note(musicBus,bass,t,STEP*3.5,{type:"sine",vol:.16,att:.02});
    }
    if(pos===4) note(musicBus,bass+7,t,STEP*3,{type:"sine",vol:.09,att:.02});
    mallet(musicBus,ch[pat[pos]],t,pos%2?.06:.085,.7);         // arpeggio (detik jam yang stabil)
    const m=melody[s%32];if(m&&loop%2===1) mallet(musicBus,m,t+.01,.07,1.2); // melodi muncul setiap pusingan ke-2
    if(pos%2===1) noise(musicBus,t,.04,.012,7000);              // hi-hat sangat perlahan
    if(pos===0&&bar===0&&s%32===0){loop++;if(loop%2===1)newPhrase()}
  }
  function tick(){
    if(!ctx||!playing)return;
    while(nextT<ctx.currentTime+.15){scheduleStep(step,nextT);step++;nextT+=STEP}
  }
  function startMusic(){
    wantMusic=true;if(!musicOn)return;init();if(!ctx||playing)return;
    playing=true;newPhrase();step=0;nextT=ctx.currentTime+.08;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0,ctx.currentTime);musicBus.gain.linearRampToValueAtTime(MUSIC_VOL,ctx.currentTime+2);
    timer=setInterval(tick,25);
  }
  function stopMusic(fade=.8){
    if(!ctx||!playing)return;playing=false;
    const t=ctx.currentTime;musicBus.gain.cancelScheduledValues(t);
    musicBus.gain.setValueAtTime(musicBus.gain.value,t);musicBus.gain.linearRampToValueAtTime(0,t+fade);
    setTimeout(()=>{if(!playing)clearInterval(timer)},fade*1000+50);
  }
  function duck(len=1){ // perlahankan muzik sekejap supaya SFX jelas
    if(!ctx||!playing)return;const t=ctx.currentTime,g=musicBus.gain;
    g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(MUSIC_VOL*.3,t+.06);
    g.setValueAtTime(MUSIC_VOL*.3,t+len);g.linearRampToValueAtTime(MUSIC_VOL,t+len+.8);
  }

  /* ---- KESAN BUNYI ---- */
  const FX={
    pick(t){mallet(sfxBus,79,t,.18,.25);note(sfxBus,86,t+.04,.12,{vol:.05})},          // "tik" pilih jawapan
    type(t){note(sfxBus,88,t,.05,{type:"triangle",vol:.05})},                           // taip nombor/huruf
    question(t){ // motif "hmm?" — dua not naik seperti soalan → cetus rasa ingin tahu
      mallet(sfxBus,67,t,.13,.5);mallet(sfxBus,72,t+.16,.13,.5);mallet(sfxBus,74,t+.32,.15,.9);
      note(sfxBus,86,t+.32,.6,{vol:.03})},
    hint(t){ // mentol menyala ✨ — kilauan naik
      [76,79,83,88,91].forEach((m,k)=>note(sfxBus,m,t+k*.06,.5,{type:"triangle",vol:.08}));
      glide(sfxBus,600,1800,t,.35,.04)},
    check(t){ // "drumroll" kecil — debaran sebelum keputusan
      for(let k=0;k<6;k++)noise(sfxBus,t+k*.045,.05,.05+k*.012,2500,"bandpass")},
    correct(t){ // 🎉 arpeggio ceria + kilauan
      [72,76,79,84].forEach((m,k)=>mallet(sfxBus,m,t+.25+k*.09,.2,.7));
      note(sfxBus,88,t+.62,1,{type:"triangle",vol:.07});note(sfxBus,91,t+.7,1,{type:"triangle",vol:.05});
      noise(sfxBus,t+.6,.5,.03,8000)},
    partial(t){ // 👍 hampir — naik tapi tak sampai penuh
      [72,76,79].forEach((m,k)=>mallet(sfxBus,m,t+.25+k*.1,.17,.6));mallet(sfxBus,77,t+.6,.12,.7)},
    wrong(t){ // 😅 lembut, tak menakutkan — "bwomp" turun + boing
      glide(sfxBus,330,180,t+.25,.45,.14,"triangle");glide(sfxBus,220,150,t+.5,.4,.1,"sine");
      note(sfxBus,64,t+.95,.3,{type:"sine",vol:.06})},
    next(t){ // whoosh ke soalan baharu
      glide(sfxBus,300,900,t,.22,.04,"sine");noise(sfxBus,t,.25,.035,1500,"bandpass")},
    start(t){[60,64,67,72,76].forEach((m,k)=>mallet(sfxBus,m,t+k*.08,.18,.6))},
    finish(t){ // 🏆 fanfare
      [[60,0],[64,.12],[67,.24],[72,.36],[67,.6],[72,.72]].forEach(([m,d])=>{mallet(sfxBus,m,t+d,.2,.6);note(sfxBus,m-12,t+d,.4,{type:"triangle",vol:.05})});
      [72,76,79,84].forEach(m=>note(sfxBus,m,t+.9,1.8,{type:"triangle",vol:.05,att:.05}));noise(sfxBus,t+.9,1,.03,8000)},
    hover(t){note(sfxBus,84,t,.08,{type:"sine",vol:.035})}
  };
  const DUCK={correct:1.6,partial:1.4,wrong:1.6,finish:2.8,hint:.8,question:1};
  function play(name){
    if(!sfxOn)return;init();if(!ctx||!FX[name])return;
    FX[name](ctx.currentTime+.01);if(DUCK[name])duck(DUCK[name]);
  }

  /* ---- butang kawalan ---- */
  function ui(){
    const w=document.createElement("div");w.className="sk-ctrl";
    w.innerHTML=`<button type="button" class="mus" id="skMus" aria-label="Muzik latar" title="Muzik latar">🎵</button>
                 <button type="button" id="skSfx" aria-label="Kesan bunyi" title="Kesan bunyi">🔊</button>`;
    document.body.appendChild(w);
    const bm=w.querySelector("#skMus"),bs=w.querySelector("#skSfx");
    const paint=()=>{bm.className="mus "+(musicOn?"on":"off");bs.className=sfxOn?"on":"off";bs.textContent=sfxOn?"🔊":"🔇"};
    bm.onclick=()=>{musicOn=!musicOn;store.set("music",musicOn);
      if(musicOn){wantMusic=true;startMusic()}else stopMusic(.4);paint()};
    bs.onclick=()=>{sfxOn=!sfxOn;store.set("sfx",sfxOn);init();
      if(ctx)sfxBus.gain.setTargetAtTime(sfxOn?.55:0,ctx.currentTime,.02);if(sfxOn)play("pick");paint()};
    paint();
  }
  if(document.body)ui();else document.addEventListener("DOMContentLoaded",ui);

  /* pilih jawapan & taip → bunyi automatik */
  document.addEventListener("click",e=>{
    const b=e.target.closest(".opt,.w,.choice,.step,.chip,.tab,.bbtns button");
    if(b&&!b.disabled)play("pick");
  },true);
  document.addEventListener("input",e=>{if(e.target.matches("input"))play("type")},true);

  /* hentikan muzik bila tab disembunyi, sambung bila kembali */
  document.addEventListener("visibilitychange",()=>{
    if(!ctx)return;if(document.hidden)ctx.suspend();else ctx.resume();
  });

  window.SFX={play,startMusic,stopMusic,
    begin(){init();play("start");setTimeout(startMusic,500)}, // dipanggil bila murid tekan "Mula"
    result(k){play("check");play(k)},                       // k = "correct" | "partial" | "wrong"
    nextQ(){play("next");setTimeout(()=>play("question"),260)},
    hint(){play("hint")},
    end(){play("finish");stopMusic(2.5)}};
})();
</script>

 {sec:"C",m:2,type:"mcq",ctx:"ovenRes",

 {sec:"C",m:2,type:"barbuild",ctx:"ovenRes",

  opts:["Litar W (Kain)","Litar X (Pin)","Litar Y (Kunci)","Litar Z (Pemadam)"],ans:[1,2],

 {sec:"C",m:4,type:"assign",ctx:"circuit",
  q:"Kelaskan objek mengikut sifat bahan.",
  chips:["⚡ Mengalirkan elektrik","🚫 Tidak mengalirkan"],
  rows:[{l:"🔑 Kunci",a:[0]},{l:"📎 Pin",a:[0]},{l:"🧣 Kain",a:[1]},{l:"🧽 Pemadam",a:[1]}],
  hint:"Mentol menyala = mengalirkan elektrik 💡.",
  why:"Mengalirkan: kunci, pin. Tidak mengalirkan: kain, pemadam."},
 {sec:"C",m:4,type:"mcq",ctx:"circuit",

  hint:"Apa yang kita NAMPAK bila bahan alirkan elektrik? 👀",

 {sec:"C",m:4,type:"multi",pick:2,ctx:"tyre",
  q:"Pilih 2 keperluan fotosintesis.",
  opts:["☀️ Cahaya matahari","🌫️ Karbon dioksida","🛞 Tayar lama","☠️ Racun"],ans:[0,1],
  hint:"Daun perlu tenaga dari langit ☀️ dan gas dari udara 🌫️.",
  why:"Cahaya matahari dan karbon dioksida."},
 {sec:"C",m:4,type:"mcq",ctx:"tyre",
  q:"Apa jadi pada rumput di bawah tayar? Kenapa?",

  why:"Tiada cahaya → tiada fotosintesis → rumput layu dan kuning."},
 {sec:"C",m:4,type:"mcq",
  q:"Adam mahu halang rumput tumbuh di kebunnya tanpa racun. Cara mana sesuai?",

  hint:"Ingat tayar tadi 🛞. Apa yang rumput tak dapat?",

 {sec:"C",m:4,type:"mcq",ctx:"garden",

  hint:"Bandingkan hasil 30 kg dan 15 kg 🥬. Siapa dapat lebih?",

 {sec:"C",m:4,type:"mcq",ctx:"garden",
  q:"Siti mahu pasang lampu di kebun pada waktu malam. Wajarkah?",
  opts:["<b>Ya, wajar.</b> Lampu beri cahaya tambahan untuk fotosintesis","<b>Tidak wajar.</b> Tumbuhan tidak perlukan cahaya"],ans:0,
  hint:"Tumbuhan perlu apa untuk buat makanan? 💡",
  why:"Lampu beri cahaya tambahan → sayur tumbuh lebih baik."},

 {sec:"C",m:5,type:"assign",ctx:"music",
  q:"Bagaimana bunyi dihasilkan?",
  chips:["Tali bergetar bila digesel dengan busur","Kulit drum bergetar bila dipukul"],
  rows:[{l:"🎻 P (Biola)",a:[0]},{l:"🥁 Q (Drum)",a:[1]}],
  hint:"Semua bunyi datang dari getaran 〰️. Bahagian mana bergetar?",
  why:"P: tali biola bergetar. Q: kulit drum bergetar."},
 {sec:"C",m:5,type:"mcq",
  q:"Di kedudukan mana Uwais dengar bunyi drum paling perlahan?",
  vis:V.bars(["M","N","O"],[5,4,3],5,"Kekuatan bunyi (dB)","Kedudukan Uwais"),
  opts:["M","N","O"],ans:2,grid:true,
  hint:"Palang paling rendah = bunyi paling lemah 📉.",
  why:"Di O, bunyi drum paling lemah."},
 {sec:"C",m:5,type:"mcq",ctx:"glass",
  q:"Kenapa gelas dengan aras air paling rendah hasilkan bunyi paling kuat?",
  opts:["Aras air rendah → permukaan gelas <b>lebih mudah bergetar</b>","Aras air rendah → permukaan gelas <b>susah bergetar</b>"],ans:0,
  hint:"Bunyi kuat = getaran banyak 〰️.",
  why:"Air sedikit → gelas lebih mudah bergetar → bunyi lebih kuat."},
 {sec:"C",m:5,type:"order",
  q:"Susun gelas dari bunyi PALING KUAT ke PALING LEMAH.",
  vis:`<div style="display:flex;flex-direction:column;align-items:center;gap:8px">${V.glasses()}${V.bars(["A","B","C","D"],[5,4,3,1.5],5,"Kekuatan bunyi","Gelas")}</div>`,
  instr:"Tekan gelas ikut turutan.",
  items:["A","B","C","D"],ans:["A","B","C","D"],
  hint:"Getaran makin kurang, bunyi makin lemah 📉.",
  why:"Gelas A bergetar paling banyak. B, C, D makin kurang bergetar."}
];

/* ===== STATE ===== */
let i=0,score=0,hintUsed=false,checked=false,sel=null,results=[],muted=false;
const $=id=>document.getElementById(id);

/* ===== BUNYI ===== */
let ac=null;
function tone(fs,dur=.12,type="sine"){
  return; // bunyi lama dimatikan — kini diurus oleh BUNYI-KIT
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    fs.forEach((f,k)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
      o.connect(g);g.connect(ac.destination);const t=ac.currentTime+k*dur;
      g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+dur*1.6);o.start(t);o.stop(t+dur*1.8);});
  }catch(e){}
}
function toggleMute(){muted=!muted;$("muteBtn").textContent=muted?"🔇":"🔊"}

/* ===== ANIMASI ===== */
function confetti(n=60){
  const c=["#ef7a5c","#f2e36b","#7fdc6c","#ef6fd6","#d0d9ff","#ffffff"];
  for(let k=0;k<n;k++){const d=document.createElement("div");d.className="confetti";
    d.style.left=Math.random()*100+"vw";d.style.background=c[k%c.length];
    d.style.animationDuration=(1.6+Math.random()*1.6)+"s";d.style.animationDelay=(Math.random()*.4)+"s";
    document.body.appendChild(d);setTimeout(()=>d.remove(),3800);}
}
function burst(e){const d=document.createElement("div");d.className="burst";d.textContent=e;document.body.appendChild(d);setTimeout(()=>d.remove(),1700)}
function flash(){const d=document.createElement("div");d.className="flash";document.body.appendChild(d);setTimeout(()=>d.remove(),700)}
function anim(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}

/* ===== ALIRAN ===== */
function startQuiz(){$("start").classList.add("hidden");$("quiz").classList.remove("hidden");SFX.begin();render()}

function render(){
  const q=Q[i];hintUsed=false;checked=false;
  sel = q.type==="mcq"?null : q.type==="multi"?[] : q.type==="assign"?q.rows.map(()=>[]) : q.type==="order"?[] : q.bars.map(()=>0);
  $("secPill").textContent="Bahagian "+q.sec;
  $("prog").style.width=(i/Q.length*100)+"%";
  $("scoreNow").textContent=Math.round(score);
  $("ctxSlot").innerHTML=q.ctx?`<div class="stim">${CTX[q.ctx]}</div>`:"";
  let h=`<div class="qhead"><span class="qlabel">Soalan ${i+1} <small>/ ${Q.length} · ${q.m} markah</small></span>`;
  h+=`<div class="qtext">${q.q}</div>`;
  if(q.vis)h+=`<div class="visual">${q.vis}</div>`;
  if(q.instr)h+=`<div class="instr">👉 ${q.instr}</div>`;
  else if(q.type==="multi"&&q.pick)h+=`<div class="instr">👉 Pilih ${q.pick} jawapan.</div>`;
  h+=`<div class="hintbox" id="hintSlot"></div></div>`;
  h+=`<div id="area">${area(q)}</div>`;
  h+=`<div class="fb" id="fbSlot"></div>`;
  h+=`<button class="hint-tab" id="hintBtn" onclick="showHint()"><span class="bulb">💡</span><span id="hl">Petunjuk</span></button>
      <button class="semak" id="checkBtn" onclick="check()" disabled>Semak</button>`;
  const card=$("qcard");card.innerHTML=h;card.classList.remove("okfx","badfx");
  window.scrollTo({top:0,behavior:"smooth"});
}

function area(q){
  const L="ABCDEFG";
  if(q.type==="mcq"){
    return `<div class="opts ${q.opts.length%2?"odd":""}">`+q.opts.map((o,k)=>{
      const body=Array.isArray(o)?`<span class="two">${o.map((x,j)=>`<span><b>${q.cols[j]}:</b> ${x}</span>`).join("")}</span>`:`<span>${o}</span>`;
      return `<button class="opt" id="o${k}" onclick="pickMcq(${k})">${body}</button>`}).join("")+`</div>`;
  }
  if(q.type==="multi"){
    return `<div class="opts ${q.opts.length%2?"odd":""}">`+q.opts.map((o,k)=>`<button class="opt" id="o${k}" onclick="pickMulti(${k})"><span>${o}</span></button>`).join("")+`</div>`;
  }
  if(q.type==="assign"){
    return q.rows.map((r,ri)=>{const ch=r.chips||q.chips;
      return `<div class="row" id="r${ri}"><div class="rowlab">${r.l}</div><div class="chips">${ch.map((c,ci)=>`<button class="chip" id="c${ri}_${ci}" onclick="pickChip(${ri},${ci})">${c}</button>`).join("")}</div></div>`}).join("");
  }
  if(q.type==="order"){
    return `<div class="seq" id="seq"></div><div class="chips">${q.items.map((t,k)=>`<button class="chip" id="it${k}" onclick="pickOrder(${k})" style="font-size:1.4rem;min-width:70px">🥛 ${t}</button>`).join("")}
      <button class="chip small" id="clr" onclick="clearOrder()">↩️ Padam</button></div>`;
  }
  if(q.type==="barbuild"){
    return `<div class="builder">`+q.bars.map((b,k)=>`<div class="bcol" id="b${k}"><div class="bval" id="bv${k}">0</div>
      <div class="btrack"><div class="bfill" id="bf${k}" style="height:0"></div></div>
      <div class="bbtns"><button onclick="bump(${k},-1)" id="bm${k}">−</button><button onclick="bump(${k},1)" id="bp${k}">+</button></div>
      <div class="blab">${b[0]}</div></div>`).join("")+`</div>`;
  }
}

/* ===== INPUT ===== */
function ready(v){$("checkBtn").disabled=!v}
function pickMcq(k){if(checked)return;sel=k;Q[i].opts.forEach((_,j)=>$("o"+j).classList.toggle("sel",j===k));tone([440]);ready(true)}
function pickMulti(k){
  if(checked)return;const q=Q[i];const p=sel.indexOf(k);
  if(p>=0)sel.splice(p,1);else{ if(q.pick&&sel.length>=q.pick)sel.shift(); sel.push(k);}
  q.opts.forEach((_,j)=>$("o"+j).classList.toggle("sel",sel.includes(j)));tone([440]);
  ready(q.pick?sel.length===q.pick:sel.length>0);
}
function pickChip(ri,ci){
  if(checked)return;const q=Q[i],r=q.rows[ri],s=sel[ri];const ch=r.chips||q.chips;
  if(r.multi){const p=s.indexOf(ci);p>=0?s.splice(p,1):s.push(ci);}else sel[ri]=s[0]===ci?[]:[ci];
  ch.forEach((_,j)=>$(`c${ri}_${j}`).classList.toggle("sel",sel[ri].includes(j)));tone([440]);
  ready(sel.every(x=>x.length>0));
}
function drawSeq(){
  const q=Q[i];let h="";
  for(let k=0;k<q.items.length;k++){h+=`<div class="slot ${sel[k]?"fill":""}" id="s${k}">${sel[k]||(k+1)}</div>`;if(k<q.items.length-1)h+=`<span class="arrow">➜</span>`}
  $("seq").innerHTML=`<span style="font-weight:800">🔊</span>`+h+`<span style="font-weight:800">🔈</span>`;
  q.items.forEach((t,k)=>$("it"+k).disabled=sel.includes(t));
  ready(sel.length===q.items.length);
}
function pickOrder(k){if(checked)return;const t=Q[i].items[k];if(!sel.includes(t)){sel.push(t);tone([440+sel.length*60])}drawSeq()}
function clearOrder(){if(checked)return;sel=[];drawSeq()}
function bump(k,d){
  if(checked)return;const q=Q[i];sel[k]=Math.max(0,Math.min(q.max,sel[k]+d));
  $("bv"+k).textContent=sel[k];$("bf"+k).style.height=(sel[k]/q.max*100)+"%";tone([300+sel[k]*60]);
  ready(sel.some(v=>v>0));
}
// hook: draw empty seq after render
const _render=render;render=function(){_render();if(Q[i].type==="order")drawSeq()};

/* ===== PETUNJUK (1 sahaja) ===== */
function showHint(){
  if(hintUsed||checked)return;hintUsed=true;
  const hs=$("hintSlot");hs.innerHTML=`💡 ${Q[i].hint}`;hs.classList.add("show");
  $("hintBtn").disabled=true;$("hl").textContent="Dah guna";SFX.hint();
}

/* ===== SEMAK (sekali sahaja) ===== */
function check(){
  if(checked)return;checked=true;const q=Q[i];let frac=0;
  if(q.type==="mcq"){
    frac=sel===q.ans?1:0;
    $("o"+sel).classList.remove("sel");$("o"+sel).classList.add(frac?"right":"wrong");
    if(!frac&&TUNJUK_JAWAPAN)$("o"+q.ans).classList.add("right");
    q.opts.forEach((_,j)=>$("o"+j).disabled=true);
  }
  if(q.type==="multi"){
    let good=0;
    if(q.pick){good=sel.filter(x=>q.ans.includes(x)).length;frac=good/q.pick;}
    else{q.opts.forEach((_,j)=>{if(sel.includes(j)===q.ans.includes(j))good++});frac=good/q.opts.length;if(frac<1&&frac>0)frac=Math.floor(frac*2)/2;}
    q.opts.forEach((_,j)=>{const b=$("o"+j);b.disabled=true;
      b.classList.remove("sel");if(sel.includes(j))b.classList.add(q.ans.includes(j)?"right":"wrong");
      else if(q.ans.includes(j)&&TUNJUK_JAWAPAN)b.classList.add("right");});
  }
  if(q.type==="assign"){
    let good=0;
    q.rows.forEach((r,ri)=>{const ch=r.chips||q.chips;const s=sel[ri];
      const ok=s.length===r.a.length&&s.every(x=>r.a.includes(x));if(ok)good++;
      $("r"+ri).classList.add(ok?"right":"wrong");
      ch.forEach((_,j)=>{const c=$(`c${ri}_${j}`);c.disabled=true;c.classList.remove("sel");
        if(s.includes(j))c.classList.add(r.a.includes(j)?"right":"wrong");
        else if(r.a.includes(j)&&TUNJUK_JAWAPAN&&!ok)c.classList.add("miss");});
    });
    frac=good/q.rows.length;
  }
  if(q.type==="order"){
    let good=0;q.ans.forEach((t,k)=>{const ok=sel[k]===t;if(ok)good++;$("s"+k).classList.add(ok?"right":"wrong")});
    frac=good/q.ans.length;q.items.forEach((_,k)=>$("it"+k).disabled=true);$("clr").disabled=true;
  }
  if(q.type==="barbuild"){
    let good=0;q.bars.forEach((b,k)=>{const ok=sel[k]===b[1];if(ok)good++;$("b"+k).classList.add(ok?"right":"wrong");
      $("bm"+k).disabled=true;$("bp"+k).disabled=true;});
    frac=good/q.bars.length;
  }
  const got=q.m*frac;score+=got;results.push(frac);
  $("scoreNow").textContent=Math.round(score);
  $("hintBtn").disabled=true;

  const card=$("qcard");let cls,big;
  let emo;
  if(frac===1){cls="ok";emo="🌟";big=pick(["Hebat!","Betul!","Bagus!","Pandai!"]);confetti();burst("⭐");anim(card,"okfx");SFX.result("correct");}
  else if(frac>0){cls="mid";emo="👍";big="Hampir betul!";burst("👍");anim(card,"okfx");SFX.result("partial");}
  else{cls="bad";emo="💪";big=pick(["Alamak!","Belum tepat","Tak apa!"]);flash();anim(card,"badfx");SFX.result("wrong");}
  let fb=`<span class="emo">${emo}</span><span><span class="head">${big}</span>+${fmt(got)} / ${q.m} markah`;
  if(frac<1&&TUNJUK_JAWAPAN)fb+=`<div class="ans">🔧 ${q.why}</div>`;
  else if(frac===1)fb+=`<div class="ans">✔️ ${q.why}</div>`;
  fb+=`</span>`;
  const fs=$("fbSlot");fs.className="fb show "+cls;fs.innerHTML=fb;
  const last=i===Q.length-1;
  const nb=$("checkBtn");nb.className="semak next";nb.disabled=false;nb.onclick=next;
  nb.textContent=last?"Lihat Keputusan 🏆":"Seterusnya ➜";
  setTimeout(()=>$("fbSlot").scrollIntoView({behavior:"smooth",block:"center"}),150);
}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function fmt(n){return Math.round(n*10)/10}

function next(){i++;if(i<Q.length){render();SFX.nextQ()}else finish()}

function finish(){
  $("quiz").classList.add("hidden");const e=$("end");e.classList.remove("hidden");
  const s=Math.round(score);const st=s>=80?3:s>=50?2:1;
  const msg=st===3?"Cemerlang! Kamu bintang Sains! 🔬":st===2?"Bagus! Teruskan usaha! 💪":"Jangan putus asa! Ulang kaji lagi ya! 📖";
  e.innerHTML=`<div class="mascot">${st===3?"🏆":st===2?"🥈":"🌱"}</div>
   <h1>Tahniah!</h1><div class="bigscore">${s}<span style="font-size:40px">/100</span></div>
   <div class="stars">${[0,1,2].map(k=>`<span style="animation-delay:${k*.25}s;${k<st?"":"filter:grayscale(1);opacity:.35"}">⭐</span>`).join("")}</div>
   <div style="font-size:26px;font-weight:700">${msg}</div>
   <div class="dots">${results.map((f,k)=>`<span style="background:${f===1?"var(--ok)":f>0?"#f0a020":"var(--bad)"}">${k+1}</span>`).join("")}</div>
   <div class="sub" style="margin-top:12px">🟢 Betul &nbsp; 🟡 Separuh &nbsp; 🔴 Perlu ulang kaji</div>`;
  if(st>=2)confetti(120);SFX.end();window.scrollTo({top:0,behavior:"smooth"});
}
