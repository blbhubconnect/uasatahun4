<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latihan Bahasa Melayu Tahun 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7e6; --card:#ffffff; --ink:#2b2350; --muted:#6b6490;
  --pri:#7c4dff; --pri2:#a98bff; --sun:#ffc93c; --ok:#22c55e; --okbg:#e8fbef;
  --bad:#ff5a5f; --badbg:#ffeef0; --hint:#fff3c4; --line:#e9e3ff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  background:var(--bg);
  background-image:radial-gradient(circle at 10% 10%,#ffe3a3 0 60px,transparent 61px),
                   radial-gradient(circle at 92% 18%,#d9ccff 0 80px,transparent 81px),
                   radial-gradient(circle at 85% 92%,#c8f5d8 0 70px,transparent 71px);
  background-attachment:fixed;
  color:var(--ink); font-size:22px; line-height:1.45; min-height:100vh;
}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.badge{background:var(--pri);color:#fff;border-radius:999px;padding:4px 16px;font-weight:800;font-size:20px;white-space:nowrap}
.bar{flex:1;height:18px;background:#fff;border:3px solid var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun),#ff9f43);transition:width .5s}
.score{background:#fff;border:3px solid var(--sun);border-radius:999px;padding:2px 14px;font-weight:800;white-space:nowrap}
.card{background:var(--card);border-radius:28px;padding:24px;box-shadow:0 8px 0 #e6dcff,0 14px 30px rgba(80,50,160,.12);border:3px solid var(--line)}
.sec{display:inline-block;background:#efe9ff;color:var(--pri);font-weight:800;border-radius:12px;padding:2px 12px;font-size:19px}
.marks{float:right;font-weight:800;color:#e08900;font-size:19px}
h1{font-size:44px;line-height:1.1;margin:8px 0 4px;color:var(--pri)}
h2{font-size:28px;margin:14px 0 12px;line-height:1.3}
.material{background:#f7f4ff;border:3px dashed var(--pri2);border-radius:20px;padding:14px 18px;margin:12px 0;font-size:21px}
.material p{margin:6px 0}
.material img{width:100%;border-radius:12px;display:block;margin-top:8px;background:#fff}
.material .lbl{font-weight:800;color:var(--pri)}
.box{border:3px solid var(--ink);border-radius:14px;padding:10px 14px;background:#fff;margin:10px 0}
u{text-decoration-thickness:3px;text-decoration-color:var(--bad)}
.opts{display:grid;gap:12px;margin-top:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;font:inherit;font-size:23px;color:var(--ink);
  background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 16px;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--pri2)}
.opt .k{flex:none;width:44px;height:44px;border-radius:50%;background:#efe9ff;color:var(--pri);display:grid;place-items:center;font-weight:800}
.opt.sel{border-color:var(--pri);background:#f3eeff}
.opt.sel .k{background:var(--pri);color:#fff}
.opt:disabled{cursor:default}
.multi .opt .k{border-radius:10px}
.order .opt .k{background:#fff5d6;color:#c77d00}
.order .opt.sel .k{background:var(--sun);color:var(--ink)}
.words{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:25px}
.w{font:inherit;background:#fff;border:3px solid var(--line);border-radius:12px;padding:4px 12px;cursor:pointer;color:var(--ink)}
.w.sel{border-color:var(--pri);background:#f3eeff;text-decoration:underline;text-decoration-thickness:3px;text-decoration-color:var(--pri)}
.w:disabled{cursor:default}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.btn{font:inherit;font-weight:800;font-size:23px;border:none;border-radius:18px;padding:12px 24px;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.go{background:var(--pri);color:#fff;box-shadow:0 5px 0 #5a2fd6}
.hintb{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 #d9a000}
.next{background:var(--ok);color:#fff;box-shadow:0 5px 0 #15913f}
.hintbox{display:none;margin-top:14px;background:var(--hint);border-radius:18px;padding:12px 16px;border:3px solid #ffe08a;animation:pop .35s}
.hintbox.show{display:block}
.fb{display:none;margin-top:16px;border-radius:20px;padding:14px 18px;font-size:26px;font-weight:800;align-items:center;gap:14px}
.fb.show{display:flex}
.fb .emo{font-size:52px;line-height:1}
.fb.ok{background:var(--okbg);color:#138a3d;border:3px solid var(--ok);animation:pop .45s}
.fb.bad{background:var(--badbg);color:#d6343a;border:3px solid var(--bad)}
.fb.ok .emo{animation:spin 1s ease}
.card.shake{animation:shake .5s}
.card.bounce{animation:bounce .6s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(6px)}}
@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(1.04)}55%{transform:scale(.98)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes spin{0%{transform:rotate(0) scale(.5)}60%{transform:rotate(380deg) scale(1.3)}100%{transform:rotate(360deg) scale(1)}}
.center{text-align:center}
.mascot{font-size:90px;line-height:1;animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.steps{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:16px 0;font-size:19px;font-weight:700}
.steps span{background:#efe9ff;color:var(--pri);border-radius:999px;padding:4px 12px}
.big{font-size:80px;font-weight:800;color:var(--pri);line-height:1}
.stars{font-size:54px;letter-spacing:6px}
.tbl{width:100%;border-collapse:collapse;margin:16px 0;font-size:21px}
.tbl td{padding:8px 10px;border-bottom:2px dashed var(--line)}
.tbl td:last-child{text-align:right;font-weight:800}
.confetti{position:fixed;top:-20px;width:14px;height:20px;border-radius:4px;pointer-events:none;z-index:99;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-width:560px){
  body{font-size:20px}
  h1{font-size:36px} h2{font-size:24px}
  .card{padding:18px;border-radius:22px}
  .opt{font-size:21px}
  .top{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<!-- ===== BUNYI-KIT: muzik latar fokus + kesan bunyi (Web Audio, tiada fail luar) ===== -->
<style>
.sk-ctrl{position:fixed;right:14px;bottom:14px;z-index:9999;display:flex;gap:8px;background:rgba(255,255,255,.92);
  padding:6px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.sk-ctrl button{width:54px;height:54px;border-radius:50%;border:3px solid #e6e8f0;background:#fff;font-size:26px;
  cursor:pointer;transition:transform .15s;line-height:1;font-family:inherit}
.sk-ctrl button:hover{transform:scale(1.08)}
.sk-ctrl button.off{background:#eee;filter:grayscale(1);opacity:.6}
.sk-ctrl button.on.mus{animation:skPulse 1.4s ease-in-out infinite}
@keyframes skPulse{50%{transform:scale(1.07)}}
@media (max-width:520px){.sk-ctrl button{width:46px;height:46px;font-size:22px}}
</style>
<script>
(function(){
  const store={get(k,d){try{const v=localStorage.getItem("sk_"+k);return v===null?d:v==="1"}catch(e){return d}},
               set(k,v){try{localStorage.setItem("sk_"+k,v?"1":"0")}catch(e){}}};
  let ctx=null,master,musicBus,sfxBus,comp,noiseBuf=null,timer=null;
  let musicOn=store.get("music",true),sfxOn=store.get("sfx",true),playing=false,wantMusic=false;
  const MUSIC_VOL=.22,BPM=76,STEP=60/BPM/2; // 1 langkah = not 1/8
  let step=0,nextT=0,loop=0;

  function init(){
    if(ctx) return ctx.state==="suspended"&&ctx.resume();
    try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
    comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;comp.connect(ctx.destination);
    master=ctx.createGain();master.gain.value=.9;master.connect(comp);
    musicBus=ctx.createGain();musicBus.gain.value=0;musicBus.connect(master);
    sfxBus=ctx.createGain();sfxBus.gain.value=sfxOn?.55:0;sfxBus.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*.5,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  const hz=m=>440*Math.pow(2,(m-69)/12);

  /* ---- alat bunyi asas ---- */
  function note(bus,midi,t,dur,{type="sine",vol=.2,att=.008,cut=0,detune=0}={}){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=hz(midi);o.detune.value=detune;
    let out=o;
    if(cut){const f=ctx.createBiquadFilter();f.type="lowpass";f.frequency.value=cut;o.connect(f);out=f}
    out.connect(g);g.connect(bus);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);
    g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.start(t);o.stop(t+dur+.05);
  }
  function mallet(bus,midi,t,vol=.16,dur=.9){ // bunyi seperti marimba/kalimba
    note(bus,midi,t,dur,{type:"sine",vol});
    note(bus,midi+12,t,dur*.35,{type:"sine",vol:vol*.25});
  }
  function noise(bus,t,dur,vol,freq,type="highpass"){
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=noiseBuf;
    f.type=type;f.frequency.value=freq;s.connect(f);f.connect(g);g.connect(bus);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.start(t);s.stop(t+dur+.02);
  }
  function glide(bus,f1,f2,t,dur,vol,type="sine"){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;
    o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    o.connect(g);g.connect(bus);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);
    g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.start(t);o.stop(t+dur+.05);
  }

  /* ---- MUZIK LATAR: tenang, pentatonik, ~76 BPM, tiada lirik → bantu fokus & berfikir ---- */
  // Progresi C – Am – F – G (setiap satu 1 bar = 8 langkah)
  const CHORDS=[[48,[60,64,67,72]],[45,[57,60,64,69]],[41,[57,60,65,69]],[43,[55,59,62,67]]];
  const PENTA=[72,74,76,79,81,84];
  const PATTERNS=[[0,2,1,3,2,1,0,2],[0,1,2,3,2,3,1,2],[3,2,1,0,1,2,3,1],[0,2,3,2,1,2,0,1]];
  let pat=PATTERNS[0],melody=[];
  function newPhrase(){
    pat=PATTERNS[Math.floor(Math.random()*PATTERNS.length)];
    // melodi ringkas & jarang (ruang untuk berfikir)
    melody=[];for(let i=0;i<32;i++)melody.push(Math.random()<.16?PENTA[Math.floor(Math.random()*PENTA.length)]:0);
  }
  function scheduleStep(s,t){
    const bar=Math.floor(s/8)%4,pos=s%8,[bass,ch]=CHORDS[bar];
    if(pos===0){ // pad lembut + bass
      ch.slice(0,3).forEach((m,k)=>note(musicBus,m,t,STEP*8.2,{type:"triangle",vol:.035,att:.5,cut:900,detune:k*4-4}));
      note(musicBus,bass,t,STEP*3.5,{type:"sine",vol:.16,att:.02});
    }
    if(pos===4) note(musicBus,bass+7,t,STEP*3,{type:"sine",vol:.09,att:.02});
    mallet(musicBus,ch[pat[pos]],t,pos%2?.06:.085,.7);         // arpeggio (detik jam yang stabil)
    const m=melody[s%32];if(m&&loop%2===1) mallet(musicBus,m,t+.01,.07,1.2); // melodi muncul setiap pusingan ke-2
    if(pos%2===1) noise(musicBus,t,.04,.012,7000);              // hi-hat sangat perlahan
    if(pos===0&&bar===0&&s%32===0){loop++;if(loop%2===1)newPhrase()}
  }
  function tick(){
    if(!ctx||!playing)return;
    while(nextT<ctx.currentTime+.15){scheduleStep(step,nextT);step++;nextT+=STEP}
  }
  function startMusic(){
    wantMusic=true;if(!musicOn)return;init();if(!ctx||playing)return;
    playing=true;newPhrase();step=0;nextT=ctx.currentTime+.08;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0,ctx.currentTime);musicBus.gain.linearRampToValueAtTime(MUSIC_VOL,ctx.currentTime+2);
    timer=setInterval(tick,25);
  }
  function stopMusic(fade=.8){
    if(!ctx||!playing)return;playing=false;
    const t=ctx.currentTime;musicBus.gain.cancelScheduledValues(t);
    musicBus.gain.setValueAtTime(musicBus.gain.value,t);musicBus.gain.linearRampToValueAtTime(0,t+fade);
    setTimeout(()=>{if(!playing)clearInterval(timer)},fade*1000+50);
  }
  function duck(len=1){ // perlahankan muzik sekejap supaya SFX jelas
    if(!ctx||!playing)return;const t=ctx.currentTime,g=musicBus.gain;
    g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(MUSIC_VOL*.3,t+.06);
    g.setValueAtTime(MUSIC_VOL*.3,t+len);g.linearRampToValueAtTime(MUSIC_VOL,t+len+.8);
  }

  /* ---- KESAN BUNYI ---- */
  const FX={
    pick(t){mallet(sfxBus,79,t,.18,.25);note(sfxBus,86,t+.04,.12,{vol:.05})},          // "tik" pilih jawapan
    type(t){note(sfxBus,88,t,.05,{type:"triangle",vol:.05})},                           // taip nombor/huruf
    question(t){ // motif "hmm?" — dua not naik seperti soalan → cetus rasa ingin tahu
      mallet(sfxBus,67,t,.13,.5);mallet(sfxBus,72,t+.16,.13,.5);mallet(sfxBus,74,t+.32,.15,.9);
      note(sfxBus,86,t+.32,.6,{vol:.03})},
    hint(t){ // mentol menyala ✨ — kilauan naik
      [76,79,83,88,91].forEach((m,k)=>note(sfxBus,m,t+k*.06,.5,{type:"triangle",vol:.08}));
      glide(sfxBus,600,1800,t,.35,.04)},
    check(t){ // "drumroll" kecil — debaran sebelum keputusan
      for(let k=0;k<6;k++)noise(sfxBus,t+k*.045,.05,.05+k*.012,2500,"bandpass")},
    correct(t){ // 🎉 arpeggio ceria + kilauan
      [72,76,79,84].forEach((m,k)=>mallet(sfxBus,m,t+.25+k*.09,.2,.7));
      note(sfxBus,88,t+.62,1,{type:"triangle",vol:.07});note(sfxBus,91,t+.7,1,{type:"triangle",vol:.05});
      noise(sfxBus,t+.6,.5,.03,8000)},
    partial(t){ // 👍 hampir — naik tapi tak sampai penuh
      [72,76,79].forEach((m,k)=>mallet(sfxBus,m,t+.25+k*.1,.17,.6));mallet(sfxBus,77,t+.6,.12,.7)},
    wrong(t){ // 😅 lembut, tak menakutkan — "bwomp" turun + boing
      glide(sfxBus,330,180,t+.25,.45,.14,"triangle");glide(sfxBus,220,150,t+.5,.4,.1,"sine");
      note(sfxBus,64,t+.95,.3,{type:"sine",vol:.06})},
    next(t){ // whoosh ke soalan baharu
      glide(sfxBus,300,900,t,.22,.04,"sine");noise(sfxBus,t,.25,.035,1500,"bandpass")},
    start(t){[60,64,67,72,76].forEach((m,k)=>mallet(sfxBus,m,t+k*.08,.18,.6))},
    finish(t){ // 🏆 fanfare
      [[60,0],[64,.12],[67,.24],[72,.36],[67,.6],[72,.72]].forEach(([m,d])=>{mallet(sfxBus,m,t+d,.2,.6);note(sfxBus,m-12,t+d,.4,{type:"triangle",vol:.05})});
      [72,76,79,84].forEach(m=>note(sfxBus,m,t+.9,1.8,{type:"triangle",vol:.05,att:.05}));noise(sfxBus,t+.9,1,.03,8000)},
    hover(t){note(sfxBus,84,t,.08,{type:"sine",vol:.035})}
  };
  const DUCK={correct:1.6,partial:1.4,wrong:1.6,finish:2.8,hint:.8,question:1};
  function play(name){
    if(!sfxOn)return;init();if(!ctx||!FX[name])return;
    FX[name](ctx.currentTime+.01);if(DUCK[name])duck(DUCK[name]);
  }

  /* ---- butang kawalan ---- */
  function ui(){
    const w=document.createElement("div");w.className="sk-ctrl";
    w.innerHTML=`<button type="button" class="mus" id="skMus" aria-label="Muzik latar" title="Muzik latar">🎵</button>
                 <button type="button" id="skSfx" aria-label="Kesan bunyi" title="Kesan bunyi">🔊</button>`;
    document.body.appendChild(w);
    const bm=w.querySelector("#skMus"),bs=w.querySelector("#skSfx");
    const paint=()=>{bm.className="mus "+(musicOn?"on":"off");bs.className=sfxOn?"on":"off";bs.textContent=sfxOn?"🔊":"🔇"};
    bm.onclick=()=>{musicOn=!musicOn;store.set("music",musicOn);
      if(musicOn){wantMusic=true;startMusic()}else stopMusic(.4);paint()};
    bs.onclick=()=>{sfxOn=!sfxOn;store.set("sfx",sfxOn);init();
      if(ctx)sfxBus.gain.setTargetAtTime(sfxOn?.55:0,ctx.currentTime,.02);if(sfxOn)play("pick");paint()};
    paint();
  }
  if(document.body)ui();else document.addEventListener("DOMContentLoaded",ui);

  /* pilih jawapan & taip → bunyi automatik */
  document.addEventListener("click",e=>{
    const b=e.target.closest(".opt,.w,.choice,.step,.chip,.tab,.bbtns button");
    if(b&&!b.disabled)play("pick");
  },true);
  document.addEventListener("input",e=>{if(e.target.matches("input"))play("type")},true);

  /* hentikan muzik bila tab disembunyi, sambung bila kembali */
  document.addEventListener("visibilitychange",()=>{
    if(!ctx)return;if(document.hidden)ctx.suspend();else ctx.resume();
  });

  window.SFX={play,startMusic,stopMusic,
    begin(){init();play("start");setTimeout(startMusic,500)}, // dipanggil bila murid tekan "Mula"
    result(k){play("check");play(k)},                       // k = "correct" | "partial" | "wrong"
    nextQ(){play("next");setTimeout(()=>play("question"),260)},
    hint(){play("hint")},
    end(){play("finish");stopMusic(2.5)}};
})();
</script>

  prompt:"Berikut ialah keburukan racun serangga kimia dan baja kimia berdasarkan petikan <b>kecuali</b>",
  opts:["tidak mesra alam","mencemarkan alam sekitar","menyebabkan ikan-ikan mati","tanaman menjadi lebih subur"],ans:3,
  hint:"\"Kecuali\" bermaksud cari pilihan yang <b>bukan</b> keburukan, iaitu sesuatu yang baik. 🤔"},
 {sec:"Bahagian A",type:"mcq",marks:2,mat:"kitar",
  prompt:"Sekolah Mei Ling mengadakan",
  opts:["Jualan barangan terpakai","Kempen Jom Kitar Semula","Minggu Cintai Alam Sekitar","Pengumpulan barangan plastik"],ans:1,
  hint:"Lihat tajuk paling besar pada poster dalam Bahan 2. 👀"},
 {sec:"Bahagian A",type:"mcq",marks:2,
  prompt:`<div class="box">Mei Ling teringat akan botol-botol plastik, <u>surat khabar</u> dan majalah lama yang terdapat di rumahnya.</div>Penjodoh bilangan yang sesuai dengan perkataan bergaris di atas ialah`,
  opts:["keping","buah","naskah","helai"],ans:2,
  hint:"Surat khabar ialah bahan bacaan bercetak, sama seperti buku dan majalah. 📰"},
 {sec:"Bahagian A",type:"mcq",marks:2,mat:"kitar",
  prompt:"Perkataan <i>Kebaikan</i> dalam Bahan 1 dan Bahan 2 boleh digantikan dengan perkataan",
  opts:["faedah","lebihan","kegunaan","kemudahan"],ans:0,
  hint:"Cari perkataan yang sama maksud dengan \"manfaat\". 🌟"},
 {sec:"Bahagian A",type:"mcq",marks:2,mat:"kitar",
  prompt:"Pilih pernyataan yang <b>benar</b> tentang Bahan 1 dan Bahan 2.",
  opts:["Mei Ling membawa botol-botol kaca ke sekolahnya.","Kertas merupakan bahan yang tidak boleh dikitar semula.","Amalan kitar semula dapat mengurangkan pembuangan sampah.","Guru besar hendaklah membuang sampah ke dalam tong sampah kitar semula."],ans:2,
  hint:"Baca senarai \"Kebaikan\" pada poster dalam Bahan 2. ♻️"},

 {sec:"Bahagian B · 1(a)",type:"mcq",marks:2,mat:"terarium",
  prompt:"Terarium ialah ______ .",
  opts:["bahan-bahan di atas meja","taman mini di dalam balang kaca","tumbuhan hijau hiasan","hasil kerja kakak Linda"],ans:1,
  hint:"Cari ayat yang bermula dengan \"Terarium ialah...\" dalam petikan. 🔎"},
 {sec:"Bahagian B · 1(b)",type:"multi",marks:4,mat:"terarium",
  prompt:"Apakah bahan-bahan yang disediakan oleh kakak Linda untuk membuat terarium? <br><span style='color:var(--muted)'>Pilih <b>semua</b> yang betul.</span>",
  opts:["balang kaca","botol plastik","batu kecil","tanah","surat khabar","pasir","kompos","baja kimia","tumbuhan hijau hiasan"],ans:[0,2,3,5,6,8],
  hint:"Semua bahan disenaraikan dalam ayat kedua petikan, selepas perkataan \"Ada...\". 📝"},
 {sec:"Bahagian B · 1(c)",type:"word",marks:2,
  prompt:"Tekan <b>satu kata nama khas</b> dalam ayat di bawah untuk menggariskannya.",
  sentence:"Kakak Linda memasukkan batu-batu kecil ke dalam balang kaca. Kemudian, dia memasukkan campuran tanah, pasir dan kompos.",
  ans:"Linda",
  hint:"Kata nama khas ialah nama khusus, seperti nama orang. Ia bermula dengan huruf besar! 🔠"},
 {sec:"Bahagian B · 1(d)",type:"mcq",marks:2,
  prompt:`Pilih ayat yang <b>sama maksud</b> dengan ayat ini:<div class="box">Dia berasa sungguh kagum apabila melihat hasil kerja kakaknya yang kreatif dan inovatif.</div>`,
  opts:["Apabila melihat hasil kerja kakaknya yang kreatif dan inovatif itu, dia berasa sungguh kagum.","Apabila melihat hasil kerjanya yang kreatif dan inovatif itu, kakaknya berasa sungguh kagum."],ans:0,
  hint:"Siapa yang berasa kagum? Pastikan orang itu tidak bertukar! 🙋"},

 {sec:"Bahagian B · 2",type:"multi",marks:10,mat:"situasi",
  prompt:"Apakah yang perlu kamu lakukan untuk menyelesaikan masalah tersebut? <br><span style='color:var(--muted)'>Pilih <b>semua</b> tindakan yang betul.</span>",
  opts:["Membersihkan alas pasu bunga","Membiarkan air bertakung di dalam alas pasu bunga","Meletak ubat untuk menghapuskan jentik-jentik","Mencabut rumput sahaja"],ans:[0,2],
  hint:"Jentik-jentik hidup dalam air bertakung. Bagaimana caranya supaya ia tidak dapat hidup lagi? 🦟"},

 {sec:"Bahagian C",type:"order",marks:20,
  prompt:"Susun <b>proses kitar semula kertas</b> mengikut urutan yang betul. <br><span style='color:var(--muted)'>Tekan langkah satu per satu, dari 1 hingga 5.</span>",
  steps:["Mengumpulkan kertas buangan","Mengasingkan mengikut jenis kertas","Proses pembasmian kuman dan pembersihan","Memproses kertas kosong","Mencetak surat khabar, buku dan majalah"],
  show:[3,0,4,2,1],
  hint:"Kertas lama perlu dikumpul, diasing dan dibersihkan dahulu sebelum boleh jadi kertas baharu. 📄"},

 {sec:"Bahagian D",type:"multi",marks:40,mat:"taman",
  prompt:"Apakah aktiviti yang dilakukan oleh murid-murid di Taman Sains? <br><span style='color:var(--muted)'>Pilih <b>semua</b> yang betul.</span>",
  opts:["Menyiram pokok bunga","Membuat terarium","Memberi makanan kepada ikan","Menyapu daun-daun kering","Mencuci baju","Mengecat sangkar burung","Mencabut rumput","Mencetak surat khabar","Membuang sampah"],ans:[0,2,3,5,6,8],
  hint:"Lihat murid dalam gambar satu per satu. Apakah yang dipegang oleh setiap murid? 🧹"}
];

/* ---------- ENJIN ---------- */
const app=document.getElementById('app');
const total=Q.reduce((s,q)=>s+q.marks,0); // 100
let i=0, score=0, sel=null, done=false, log=[];
const L="ABCDEFGHI";
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

function start(){
  app.innerHTML=`<div class="card center">
    <div class="mascot">🦉</div>
    <h1>Jom Berlatih<br>Bahasa Melayu!</h1>
    <p style="margin:6px 0;color:var(--muted)">Tahun 4 · ${Q.length} soalan · ${total} markah</p>
    <div class="steps"><span>📖 Belajar</span><span>✏️ Cuba</span><span>💡 Petunjuk</span><span>✅ Semak</span><span>🔧 Baiki</span><span>🚀 Maju</span></div>
    <p>💡 Ada <b>1 petunjuk</b> untuk setiap soalan.<br>🎯 Jawab <b>sekali sahaja</b>, kemudian terus ke soalan seterusnya.</p>
    <div class="actions" style="justify-content:center"><button class="btn go" onclick="SFX.begin();render()">Mula! 🚀</button></div>
  </div>`;
}

function header(){
  return `<div class="top"><span class="badge">Soalan ${i+1}/${Q.length}</span>
    <div class="bar"><i style="width:${(i/Q.length)*100}%"></i></div>
    <span class="score">⭐ ${score}</span></div>`;
}

function render(){
  const q=Q[i]; done=false;
  sel = q.type==="multi"?new Set(): q.type==="order"?[]:null;
  let body="";
  if(q.type==="mcq"||q.type==="multi"){
    body=`<div class="opts ${q.type}">`+q.opts.map((o,k)=>
      `<button class="opt" data-k="${k}" onclick="pick(${k})"><span class="k">${q.type==="multi"?"☐":L[k]}</span><span>${esc(o)}</span></button>`).join("")+`</div>`;
  } else if(q.type==="order"){
    body=`<div class="opts order">`+q.show.map(k=>
      `<button class="opt" data-k="${k}" onclick="pick(${k})"><span class="k">?</span><span>${esc(q.steps[k])}</span></button>`).join("")+`</div>`;
  } else if(q.type==="word"){
    body=`<div class="words">`+q.sentence.split(" ").map((w,k)=>
      `<button class="w" data-k="${k}" onclick="pick(${k})">${esc(w)}</button>`).join("")+`</div>`;
  }
  app.innerHTML=header()+`<div class="card" id="card">
    <span class="sec">${q.sec}</span><span class="marks">${q.marks} markah</span>
    ${q.mat?`<div class="material">${M[q.mat]}</div>`:""}
    <h2>${q.prompt}</h2>
    ${body}
    <div class="hintbox" id="hint">💡 ${q.hint}</div>
    <div class="fb" id="fb"></div>
    <div class="actions">
      <button class="btn hintb" id="hb" onclick="showHint()">💡 Petunjuk</button>
      <button class="btn go" id="cb" onclick="check()" disabled>Semak ✅</button>
      <button class="btn next" id="nb" onclick="next()" style="display:none">${i<Q.length-1?"Seterusnya ➡️":"Lihat Keputusan 🏆"}</button>
    </div></div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}

function pick(k){
  if(done) return; const q=Q[i];
  if(q.type==="mcq"){ sel=k; }
  else if(q.type==="multi"){ sel.has(k)?sel.delete(k):sel.add(k); }
  else if(q.type==="order"){ const p=sel.indexOf(k); p>-1?sel.splice(p,1):sel.push(k); }
  else if(q.type==="word"){ sel=k; }
  paint();
}

function paint(){
  const q=Q[i];
  document.querySelectorAll(q.type==="word"?".w":".opt").forEach(b=>{
    const k=+b.dataset.k; let on=false;
    if(q.type==="mcq"||q.type==="word") on=sel===k;
    if(q.type==="multi"){ on=sel.has(k); b.querySelector(".k").textContent=on?"✔":"☐"; }
    if(q.type==="order"){ const p=sel.indexOf(k); on=p>-1; b.querySelector(".k").textContent=on?p+1:"?"; }
    b.classList.toggle("sel",on);
  });
  let ready = q.type==="multi"?sel.size>0 : q.type==="order"?sel.length===q.steps.length : sel!==null;
  document.getElementById("cb").disabled=!ready;
}

function showHint(){
  document.getElementById("hint").classList.add("show");
  document.getElementById("hb").disabled=true;
  SFX.hint();
}

function check(){
  if(done) return; done=true; const q=Q[i]; let got=0;
  if(q.type==="mcq") got = sel===q.ans?q.marks:0;
  if(q.type==="word") got = q.sentence.split(" ")[sel].replace(/[.,]/g,"")===q.ans?q.marks:0;
  if(q.type==="multi"){
    let hit=0,wrong=0; sel.forEach(k=>q.ans.includes(k)?hit++:wrong++);
    got=Math.round(q.marks*Math.max(0,hit-wrong)/q.ans.length);
  }
  if(q.type==="order"){
    let ok=sel.filter((k,p)=>k===p).length;
    got=Math.round(q.marks*ok/q.steps.length);
  }
  score+=got; log.push({sec:q.sec.split(" ·")[0],got,max:q.marks});
  document.querySelectorAll(".opt,.w").forEach(b=>b.disabled=true);
  document.getElementById("cb").style.display="none";
  document.getElementById("hb").style.display="none";
  document.getElementById("nb").style.display="inline-block";
  const fb=document.getElementById("fb"), card=document.getElementById("card");
  if(got===q.marks){
    fb.className="fb show ok";
    fb.innerHTML=`<span class="emo">🌟</span><span>${pickOne(["Hebat! Betul!","Syabas, tepat sekali!","Wah, pandainya!","Betul! Teruskan!"])}<br>+${got} markah</span>`;
    card.classList.add("bounce"); confetti(40); SFX.result("correct");
  } else if(got>0){
    fb.className="fb show ok";
    fb.innerHTML=`<span class="emo">👍</span><span>Hampir betul! Sedikit lagi.<br>+${got} markah</span>`;
    card.classList.add("bounce"); confetti(14); SFX.result("partial");
  } else {
    fb.className="fb show bad";
    fb.innerHTML=`<span class="emo">💪</span><span>Alamak, belum tepat.<br>Tak apa, jom teruskan!</span>`;
    card.classList.add("shake"); SFX.result("wrong");
  }
  document.querySelector(".score").textContent="⭐ "+score;
  fb.scrollIntoView({behavior:"smooth",block:"center"});
}

function next(){ i++; if(i<Q.length){ render(); SFX.nextQ(); } else finish(); }

function finish(){
  const pct=Math.round(score/total*100);
  const st=pct>=80?"⭐⭐⭐":pct>=50?"⭐⭐☆":pct>=1?"⭐☆☆":"☆☆☆";
  const msg=pct>=80?"Cemerlang! Kamu bintang bahasa! 🏆":pct>=50?"Bagus! Sikit lagi jadi juara! 💪":"Usaha yang baik! Jom ulang kaji lagi! 📚";
  const secs={}; log.forEach(r=>{secs[r.sec]=secs[r.sec]||{g:0,m:0};secs[r.sec].g+=r.got;secs[r.sec].m+=r.max;});
  app.innerHTML=`<div class="top"><span class="badge">Selesai!</span><div class="bar"><i style="width:100%"></i></div><span class="score">⭐ ${score}</span></div>
  <div class="card center bounce">
    <div class="mascot">🦉</div>
    <div class="stars">${st}</div>
    <div class="big">${score}<span style="font-size:40px">/${total}</span></div>
    <h2>${msg}</h2>
    <table class="tbl">${Object.entries(secs).map(([k,v])=>`<tr><td>${k}</td><td>${v.g} / ${v.m}</td></tr>`).join("")}</table>
  </div>`;
  confetti(pct>=50?90:30); SFX.end();
}

function pickOne(a){return a[Math.floor(Math.random()*a.length)]}
function confetti(n){
  const c=["#7c4dff","#ffc93c","#22c55e","#ff5a5f","#38bdf8","#ff9f43"];
  for(let k=0;k<n;k++){
    const d=document.createElement("div"); d.className="confetti";
    d.style.left=Math.random()*100+"vw"; d.style.background=c[k%c.length];
    d.style.animationDuration=(1.6+Math.random()*1.6)+"s"; d.style.animationDelay=(Math.random()*.4)+"s";
    document.body.appendChild(d); setTimeout(()=>d.remove(),3800);
  }
}
start();
</script>
</body>
</html>
